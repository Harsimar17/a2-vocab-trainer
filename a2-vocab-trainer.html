<title>Deutscher Wortschatz — A2</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#F6F1E5;color:#2b2620;font-family:Georgia,serif}
button{font:inherit;-webkit-tap-highlight-color:transparent}
.app{min-height:100vh;padding:36px 20px 48px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.header{text-align:center}
.kicker,.count,.chip,.nav,.mode{font-family:"Courier New",monospace}
.kicker{font-size:11px;letter-spacing:.18em;color:#8a8372;margin-bottom:4px}
.title{font-size:28px}
.subtitle{font-size:13px;color:#8a8372;margin-top:2px}
.filters{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:6px 12px;border-radius:2px;cursor:pointer}
.modes{display:flex;justify-content:center}
.mode{font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding:8px 20px;border:1px solid #2b2620;background:transparent;color:#2b2620}
.mode:first-child{border-radius:3px 0 0 3px;border-right:0}
.mode:last-child{border-radius:0 3px 3px 0}
.mode.active{background:#2b2620;color:#F6F1E5}
.content{margin-top:6px}
.count{text-align:center;font-size:12px;letter-spacing:.1em;color:#8a8372;margin-bottom:18px}
.card{width:min(420px,90vw);height:260px;margin:auto;cursor:pointer;perspective:1200px}
.card-inner{position:relative;width:100%;height:100%;transition:transform .45s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d}
.card.flipped .card-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.front{background:#FBF7EC;border:1px solid #d8cfb8;box-shadow:0 2px 0 #d8cfb8,0 8px 20px rgba(60,50,20,.08);gap:14px}
.back{transform:rotateY(180deg);color:#F6F1E5;box-shadow:0 8px 20px rgba(60,50,20,.18)}
.word{font-size:30px;line-height:1.3;text-align:center}
.hint{font-family:"Courier New",monospace;font-size:11px;color:#b0a888}
.controls{display:flex;gap:10px;justify-content:center;margin-top:18px}
.nav{font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:8px 14px;border-radius:2px;border:1px solid #2b2620;background:#2b2620;color:#F6F1E5}
.empty{text-align:center;color:#8a8372}
.quiz{text-align:center}
.quizword{font-size:26px;margin:8px 0 18px}
.options{display:flex;flex-direction:column;gap:10px;width:min(420px,90vw);margin:auto}
.option{text-align:left;font-family:Georgia,serif;font-size:16px;padding:12px 16px;border-radius:4px;border:1px solid #d8cfb8;background:#FBF7EC;color:#2b2620}
.option.correct{background:#3F7A55;border-color:#3F7A55;color:#F6F1E5}
.option.wrong{background:#A5354A;border-color:#A5354A;color:#F6F1E5}
.next{margin-top:18px}
</style>
</head>

Abgemacht!", "It's a deal! / Agreed!"], ["Ich melde mich.", "I'll be in touch."], ["Ich rufe dich zurück.", "I'll call you back."], ["Könnten Sie mir bitte helfen?", "Could you help me, please?"], ["Würden Sie bitte ...?", "Would you please ...?"], ["Darf ich ...?", "May I ...?"], ["Es tut mir wirklich leid.", "I'm really sorry."], ["Das macht nichts.", "It doesn't matter."], ["Mach dir keine Sorgen.", "Don't worry."], ["Keine Sorge!", "No worries!"], ["Ich habe mich erkältet.", "I've caught a cold."], ["Mir geht es nicht so gut.", "I'm not feeling great."], ["Was ist los?", "What's wrong? / What's up?"], ["Was ist passiert?", "What happened?"], ["Ich habe eine Frage zu ...", "I have a question about ..."], ["Ich interessiere mich für ...", "I'm interested in ..."], ["Ich freue mich auf ...", "I'm looking forward to ..."], ["Ich ärgere mich über ...", "I'm annoyed about ..."], ["Ich kümmere mich darum.", "I'll take care of it."], ["Es lohnt sich.", "It's worth it."], ["Das ist mir zu teuer.", "That's too expensive for me."], ["Haben Sie das in einer anderen Größe?", "Do you have this in another size?"], ["Kann ich das umtauschen?", "Can I exchange this?"], ["Ich hätte gern einen Termin.", "I'd like to make an appointment."], ["Wann passt es Ihnen?", "When suits you?"], ["Das passt mir gut.", "That suits me well."], ["Ich bin damit einverstanden.", "I agree to that."], ["Bis dann! / Bis gleich!", "See you then! / See you shortly!"], ["Schönes Wochenende!", "Have a nice weekend!"], ["Gute Reise! / Gute Fahrt!", "Have a good trip!"]]};
const META = {
 der:{label:"der",color:"#3A5A8C"}, die:{label:"die",color:"#A5354A"},
 das:{label:"das",color:"#3F7A55"}, adj:{label:"adj.",color:"#8A6A2B"},
 verb:{label:"verb",color:"#6B4A8A"}, func:{label:"func.",color:"#4A7A8C"},
 phrase:{label:"phrase",color:"#B0722E"}
};
const CATS=["der","die","das","adj","verb","func","phrase"];
const ALL=[];
let id=0;
for(const cat of CATS) for(const [w,en] of DATA[cat]) {
  const de=(cat==="der"||cat==="die"||cat==="das")?cat+" "+w:w;
  ALL.push({id:id++,de,en,cat});
}
let active=[...CATS], mode="flash", order=[], idx=0, flipped=false;
let q=null,picked=null,score={right:0,total:0};

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pool(){return ALL.filter(x=>active.includes(x.cat))}
function chip(cat){return '<span class="chip" style="color:'+META[cat].color+';border:1px solid '+META[cat].color+'">'+META[cat].label+'</span>'}
function resetFlash(){order=shuffle(pool().map(x=>x.id));idx=0;flipped=false}
function makeQuestion(p){
 const correct=p[Math.floor(Math.random()*p.length)];
 const same=p.filter(x=>x.cat===correct.cat&&x.id!==correct.id);
 const dp=(same.length>=3?same:p.filter(x=>x.id!==correct.id));
 return {correct,options:shuffle([correct,...shuffle(dp).slice(0,3)])}
}
function resetQuiz(){const p=pool();q=p.length>=4?makeQuestion(p):null;picked=null;score={right:0,total:0}}
function render(){
 const p=pool();
 let h='<div class="wrap"><div class="header"><div class="kicker">A2 · WAYSTAGE</div><div class="title">Deutscher Wortschatz</div><div class="subtitle">'+ALL.length+' cards — nouns, verbs, adjectives, connectors & phrases</div></div>';
 h+='<div class="filters">'+CATS.map(c=>{
   const on=active.includes(c);
   return '<button class="chip" onclick="toggleCat(\''+c+'\')" style="color:'+(on?"#F6F1E5":META[c].color)+';border:1px solid '+META[c].color+';background:'+(on?META[c].color:"transparent")+'">'+META[c].label+'</button>';
 }).join('')+'</div>';
 h+='<div class="modes"><button class="mode '+(mode==="flash"?"active":"")+'" onclick="setMode(\'flash\')">Flashcards</button><button class="mode '+(mode==="quiz"?"active":"")+'" onclick="setMode(\'quiz\')">Quiz</button></div>';
 h+='<div class="content">'+(mode==="flash"?flashHTML(p):quizHTML(p))+'</div></div>';
 document.getElementById("app").innerHTML=h;
}
function flashHTML(p){
 if(!p.length)return '<p class="empty">No cards match this filter — pick at least one category above.</p>';
 const card=ALL.find(x=>x.id===order[idx]);
 const size=card.de.length>28?18:card.de.length>16?24:30;
 return '<div class="count">CARD '+(idx+1)+' / '+order.length+'</div>'+
 '<div class="card '+(flipped?"flipped":"")+'" onclick="flip()"><div class="card-inner">'+
 '<div class="face front">'+chip(card.cat)+'<div class="word" style="font-size:'+size+'px">'+esc(card.de)+'</div><div class="hint">tap to reveal</div></div>'+
 '<div class="face back" style="background:'+META[card.cat].color+'"><div class="word" style="font-size:'+(card.en.length>28?17:22)+'px">'+esc(card.en)+'</div></div>'+
 '</div></div><div class="controls"><button class="nav" onclick="prev(event)">‹ prev</button><button class="nav" onclick="reshuffle(event)">⟲ shuffle</button><button class="nav" onclick="next(event)">next ›</button></div>';
}
function quizHTML(p){
 if(p.length<4)return '<p class="empty">Pick at least a couple categories above — need a few options to quiz from.</p>';
 return '<div class="quiz"><div class="count">SCORE '+score.right+' / '+score.total+'</div>'+
 '<div>'+chip(q.correct.cat)+'</div><div class="quizword">'+esc(q.correct.de)+'</div><div class="options">'+
 q.options.map(o=>'<button class="option '+(picked?(o.id===q.correct.id?"correct":o.id===picked.id?"wrong":""):"")+'" onclick="choose('+o.id+')">'+esc(o.en)+'</button>').join('')+
 '</div>'+(picked?'<button class="nav next" onclick="nextQ()">next question ›</button>':"")+'</div>';
}
function esc(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function toggleCat(c){active=active.includes(c)?active.filter(x=>x!==c):[...active,c];resetFlash();resetQuiz();render()}
function setMode(m){mode=m;if(m==="flash")resetFlash();else resetQuiz();render()}
function flip(){flipped=!flipped;render()}
function next(e){e&&e.stopPropagation();flipped=false;idx=(idx+1)%order.length;render()}
function prev(e){e&&e.stopPropagation();flipped=false;idx=(idx-1+order.length)%order.length;render()}
function reshuffle(e){e&&e.stopPropagation();resetFlash();render()}
function choose(id){if(picked)return;picked=q.options.find(x=>x.id===id);score.total++;if(picked.id===q.correct.id)score.right++;render()}
function nextQ(){q=makeQuestion(pool());picked=null;render()}
resetFlash();resetQuiz();render();
</script>
