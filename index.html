const CATEGORY_META = {
  der: { label: "der", color: "#3A5A8C" },
  die: { label: "die", color: "#A5354A" },
  das: { label: "das", color: "#3F7A55" },
  adj: { label: "adj.", color: "#8A6A2B" },
  verb: { label: "verb", color: "#6B4A8A" },
  sep: { label: "trenn.", color: "#2E7D74" },
  func: { label: "func.", color: "#4A7A8C" },
  phrase: { label: "phrase", color: "#B0722E" },
};

// ---------- DATA: fetched at runtime from a hosted JSON file ----------
// The vocabulary itself (nouns/verbs/adjectives/connectors/phrases for A1/A2/B1)
// is no longer bundled in this file. It's fetched from VOCAB_DATA_URL on startup
// (see App below) and flattened here into the same {id, de, en, cat, lvl, example}
// shape the rest of the app already expects, so everything below this point is
// unchanged from when the data was hardcoded.
// Prefer the copy shipped next to this file (works offline / on GitHub Pages);
// fall back to the canonical hosted copy if it isn't reachable.
const VOCAB_DATA_URL = "./german_vocab.json";
const VOCAB_DATA_URL_FALLBACK = "https://harsimar17.github.io/Deutsch-Vocab-Helper/german_vocab.json";

// Expected JSON shape:
// { levels: { A1|A2|B1: {
//     nouns: { der: [{de,en,example}], die: [...], das: [...] },
//     adjectives: [{de,en}], verbs: [{de,en}],
//     separable_verbs: [{de,en,prefix,example}],   // trennbare Verben
//     function_words: [{de,en}], phrases: [{de,en}]
// } } }
function buildDataFromJson(json) {
  const items = [];
  let id = 0;
  const levels = ["A1", "A2", "B1"];
  const nounCats = ["der", "die", "das"];
  const plainCats = { adjectives: "adj", verbs: "verb", separable_verbs: "sep", function_words: "func", phrases: "phrase" };

  levels.forEach((lvl) => {
    const levelData = json && json.levels && json.levels[lvl];
    if (!levelData) return;

    const nouns = levelData.nouns || {};
    nounCats.forEach((art) => {
      (nouns[art] || []).forEach((entry) => {
        items.push({ id: id++, de: entry.de, en: entry.en, cat: art, lvl, example: entry.example || null });
      });
    });

    Object.keys(plainCats).forEach((key) => {
      const cat = plainCats[key];
      (levelData[key] || []).forEach((entry) => {
        items.push({ id: id++, de: entry.de, en: entry.en, cat, lvl, example: entry.example || null, prefix: entry.prefix || null });
      });
    });
  });

  return items;
}

const CATS = ["der", "die", "das", "adj", "verb", "sep", "func", "phrase"];
const LEVELS = ["A1", "A2", "B1"];
// A word drilled in the Review tab (or missed anywhere) leaves the review list
// after this many correct answers; a fresh miss resets that progress to 0.
const REVIEW_CLEARS = 2;
const LEVEL_META = { A1: "BREAKTHROUGH", A2: "WAYSTAGE", B1: "THRESHOLD" };

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ---------- PRONUNCIATION (Web Speech API) ----------
// Speaks German text aloud using the browser's built-in speech synthesis.
// Works offline on iOS/Safari (uses the system German voice when present).
function speakGerman(text) {
  if (typeof window === "undefined" || !window.speechSynthesis) return;
  const clean = String(text || "")
    .replace(/\([^)]*\)/g, " ")      // drop parenthetical notes: (Pl.), (sich) …
    .replace(/\s*\/\s*/g, ", ")       // "der Hund / die Hündin" → natural pause
    .replace(/\s{2,}/g, " ")
    .trim();
  if (!clean) return;
  try {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(clean);
    u.lang = "de-DE";
    u.rate = 0.9;
    const de = (window.speechSynthesis.getVoices() || []).find((v) => /^de(-|_)/i.test(v.lang));
    if (de) u.voice = de;
    window.speechSynthesis.speak(u);
  } catch (e) {
    /* speech unsupported — silently no-op */
  }
}
// Prime the voice list early (some browsers populate it lazily).
if (typeof window !== "undefined" && window.speechSynthesis) {
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
}

// direction: 'de-en' shows German, asks for English. 'en-de' shows English, asks for German.
function promptText(card, direction) {

// ---------- GEMINI EXAMPLE SENTENCES ----------
// Every card's example sentence is generated by Gemini and then cached forever in
// this browser's localStorage, so each word costs one API call total — after that
// it renders instantly and offline. The API key (Settings) also lives only in
// this browser; nothing is bundled, committed, or sent anywhere but Google.
const GEMINI_MODEL = "gemini-3.6-flash"; // one-line switch if Google retires it

const AI_CACHE_KEY = "a2vocab.aiSentences.v1";
let aiCache = (() => {
  try {
    return JSON.parse(localStorage.getItem(AI_CACHE_KEY)) || {};
  } catch (e) {
    return {};
  }
})();
function cacheAiSentence(word, data) {
  aiCache[word] = data;
  try {
    localStorage.setItem(AI_CACHE_KEY, JSON.stringify(aiCache));
  } catch (e) {
    /* storage full / disabled — sentence just won't survive a reload */
  }
}

async function fetchGeminiSentence(card, apiKey) {
  const catLabel = (CATEGORY_META[card.cat] || {}).label || card.cat;
  const prompt =
    `Write ONE short, natural German example sentence at CEFR A2 level (max 12 words) ` +
    `that uses the German word "${card.de}" (${catLabel}, English meaning: "${card.en}"). ` +
    `Use simple everyday vocabulary and grammar. Then translate that exact sentence to English. ` +
    `Return only JSON: {"de":"<sentence>","en":"<translation>"}.`;
  const res = await fetch(
    `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${encodeURIComponent(apiKey)}`,
    {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        contents: [{ parts: [{ text: prompt }] }],
        generationConfig: {
          responseMimeType: "application/json",
          temperature: 0.7,
        },
      }),
    }
  );
  if (!res.ok) {
    let detail = `HTTP ${res.status}`;
    try {
      const errJson = await res.json();
      detail = (errJson.error && errJson.error.message) || detail;
    } catch (e) {
      /* non-JSON error body */
    }
    throw new Error(detail);
  }
  const data = await res.json();
  const cand = data && data.candidates && data.candidates[0];
  const parts = (cand && cand.content && cand.content.parts) || [];
  // Thinking models can emit a thought part first — take the first part with text.
  const textPart = parts.find((p) => p && typeof p.text === "string" && p.text.trim());
  const text = textPart && textPart.text;
  if (!text) {
    throw new Error(
      cand && cand.finishReason && cand.finishReason !== "STOP"
        ? `no sentence (${cand.finishReason})`
        : "empty response"
    );
  }
  let parsed;
  try {
    parsed = JSON.parse(text);
  } catch (e) {
    // Model ignored the JSON instruction — fall back to the raw text as the sentence.
    parsed = { de: text.replace(/^```(?:json)?|```$/g, "").trim(), en: "" };
  }
  if (!parsed || !parsed.de) throw new Error("unexpected response shape");
  return { de: String(parsed.de).trim(), en: String(parsed.en || "").trim() };
}

function AiSentence({ card, apiKey }) {
  const word = card.de;
  const [state, setState] = useState(() =>
    aiCache[word] ? { status: "done", data: aiCache[word] } : { status: "idle" }
  );

  const run = () => {
    setState({ status: "loading" });
    fetchGeminiSentence(card, apiKey)
      .then((data) => {
        cacheAiSentence(word, data);
        setState({ status: "done", data });
      })
      .catch((err) => setState({ status: "error", message: (err && err.message) || String(err) }));
  };

  // Cached → show at once. Not cached + key present → fetch once, automatically.
  React.useEffect(() => {
    if (aiCache[word]) {
      setState({ status: "done", data: aiCache[word] });
      return;
    }
    if (!apiKey) {
      setState({ status: "idle" });
      return;
    }
    let cancelled = false;
    setState({ status: "loading" });
    fetchGeminiSentence(card, apiKey)
      .then((data) => {
        if (cancelled) return;
        cacheAiSentence(word, data);
        setState({ status: "done", data });
      })
      .catch((err) => {
        if (cancelled) return;
        setState({ status: "error", message: (err && err.message) || String(err) });
      });
    return () => { cancelled = true; };
  }, [word, apiKey]);

  if (state.status === "idle") {
    return (
      <div style={{ fontFamily: "var(--font-mono)", fontSize: "10px", letterSpacing: "0.08em", color: "var(--ink-faint)", textAlign: "center", maxWidth: "min(420px, 90vw)", lineHeight: 1.6 }}>
        add a Gemini API key in settings ▸ for example sentences
      </div>
    );
  }
  if (state.status === "loading") {
    return (
      <div style={{ fontFamily: "var(--font-mono)", fontSize: "11px", letterSpacing: "0.1em", color: "var(--ink-faint)" }}>
        ✨ writing a sentence …
      </div>
    );
  }
  if (state.status === "error") {
    return (
      <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: "6px" }}>
        <div style={{ fontFamily: "var(--font-mono)", fontSize: "11px", color: "#A5354A", maxWidth: "min(420px, 90vw)", textAlign: "center", lineHeight: 1.5 }}>
          Gemini: {state.message}
        </div>
        <button
          onClick={run}
          style={{ fontFamily: "var(--font-mono)", fontSize: "10px", color: "var(--ink-soft)", background: "transparent", border: "1px solid var(--line)", borderRadius: "999px", padding: "4px 12px", cursor: "pointer" }}
        >
          retry
        </button>
      </div>
    );
  }
  return (
    <div
      style={{
        display: "flex", alignItems: "center", justifyContent: "center", gap: "10px",
        maxWidth: "min(440px, 92vw)", padding: "10px 14px",
        background: "var(--paper-raised)", border: "1px solid var(--line)", borderRadius: "12px",
        boxShadow: "var(--shadow-soft)",
      }}
    >
      <SpeakButton text={state.data.de} size={30} />
      <div style={{ textAlign: "center" }}>
        <div style={{ fontFamily: "var(--font-serif)", fontWeight: 600, fontSize: "16px", color: "var(--ink)", lineHeight: 1.35 }}>{state.data.de}</div>
        {state.data.en && (
          <div style={{ fontFamily: "var(--font-serif)", fontStyle: "italic", fontSize: "13px", color: "var(--ink-soft)", marginTop: "3px" }}>{state.data.en}</div>
        )}
        <div style={{ fontFamily: "var(--font-mono)", fontSize: "8px", letterSpacing: "0.14em", textTransform: "uppercase", color: "var(--ink-faint)", marginTop: "5px" }}>✨ generated by Gemini</div>
      </div>
    </div>
  );
}

function GeminiKeyField({ value, onChange }) {
  const [draft, setDraft] = useState(value || "");
  const [show, setShow] = useState(false);
  React.useEffect(() => { setDraft(value || ""); }, [value]);
  const dirty = draft.trim() !== (value || "");
  return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: "7px" }}>
      <div style={{ fontFamily: "var(--font-mono)", fontSize: "10px", letterSpacing: "0.12em", textTransform: "uppercase", color: value ? "#3F7A55" : "var(--ink-soft)" }}>
        ✨ Gemini API key · {value ? "set" : "off"}
      </div>
      <div style={{ display: "flex", gap: "6px", width: "min(430px, 92vw)" }}>
        <input
          type={show ? "text" : "password"}
          value={draft}
          onChange={(e) => setDraft(e.target.value)}
          placeholder="paste Google AI Studio key (AIza…)"
          spellCheck={false}
          autoComplete="off"
          style={{
            flex: 1, minWidth: 0, fontFamily: "var(--font-mono)", fontSize: "12px",
            padding: "8px 10px", borderRadius: "8px", border: "1px solid var(--line)",
            background: "var(--paper-raised)", color: "var(--ink)",
          }}
        />
        <button onClick={() => setShow((s) => !s)} style={miniBtn}>{show ? "hide" : "show"}</button>
        <button onClick={() => onChange(draft.trim())} disabled={!dirty} style={{ ...miniBtn, opacity: dirty ? 1 : 0.4, cursor: dirty ? "pointer" : "default" }}>save</button>
        {value && (
          <button onClick={() => { onChange(""); setDraft(""); }} style={{ ...miniBtn, color: "#A5354A", borderColor: "#A5354A" }}>clear</button>
        )}
      </div>
      <div style={{ fontFamily: "var(--font-mono)", fontSize: "9px", color: "var(--ink-faint)", maxWidth: "min(430px, 92vw)", textAlign: "center", lineHeight: 1.6 }}>
        Kept only in this browser (localStorage) — never committed. Get a key at aistudio.google.com/apikey. Needed to generate the example sentence shown on each card &amp; quiz answer (cached after the first time).
      </div>
    </div>
  );
}

function LevelToggle({ levels, onToggle }) {

    <div
      style={{

        padding: "4px",

      {LEVELS.map((lv) => {

        return (
          <button

              fontSize: "12px",
              fontWeight: 500,
              letterSpacing: "0.14em",
              textTransform: "uppercase",

              cursor: "pointer",
            }}
          >
            {lv}
          </button>
        );
      })}
    </div>
  );
}

function Flashcards({ pool, allData, direction, noRepeat, onResult, geminiKey }) {
  const [order, setOrder] = useState(() => shuffle(pool.map((d) => d.id)));
  const [idx, setIdx] = useState(0);
  const [flipped, setFlipped] = useState(false);
  const [done, setDone] = useState(false);
  const byId = useMemo(() => Object.fromEntries(allData.map((d) => [d.id, d])), [allData]);

  React.useEffect(() => {
    setOrder(shuffle(pool.map((d) => d.id)));
    setIdx(0);
    setFlipped(false);
    setDone(false);
  }, [pool.length, noRepeat]);

  React.useEffect(() => {
    setFlipped(false);
  }, [direction]);

  if (pool.length === 0) {
    return <p style={{ textAlign: "center", color: "#8a8372" }}>No cards match this filter — pick at least one category above.</p>;
  }

  const restart = () => {
    setOrder(shuffle(pool.map((d) => d.id)));
    setIdx(0);
    setFlipped(false);
    setDone(false);
  };

  if (done) {
    return (
      <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: "16px", padding: "40px 0" }}>
        <div style={{ fontFamily: "var(--font-serif)", fontSize: "22px", color: "#2b2620", textAlign: "center" }}>
          All {order.length} / {order.length} cards done 🎉
        </div>
        <button onClick={restart} style={navBtnStyle}>⟲ start over</button>
      </div>
    );
  }

  const card = byId[order[idx]];
  const front = promptText(card, direction);
  const back = answerText(card, direction);

  const next = () => {
    setFlipped(false);
    if (idx + 1 >= order.length) {
      if (noRepeat) {
        setDone(true);
      } else {
        setIdx(0);
      }
    } else {
      setIdx((i) => i + 1);
    }
  };
  const prev = () => {
    setFlipped(false);
    setIdx((i) => (i - 1 + order.length) % order.length);
  };
  const reshuffle = () => {
    setOrder(shuffle(pool.map((d) => d.id)));
    setIdx(0);
    setFlipped(false);
  };

  return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: "18px" }}>
      <div
        style={{
          fontFamily: "var(--font-mono)",
          fontSize: "12px",
          letterSpacing: "0.1em",
          color: "#8a8372",
        }}
      >
        {noRepeat ? `${idx + 1} / ${order.length} attempted` : `CARD ${idx + 1} / ${order.length}`}
      </div>

      <div
        onClick={() => setFlipped((f) => !f)}
        style={{
          width: "min(440px, 92vw)",
          height: "280px",
          cursor: "pointer",
          perspective: "1400px",
        }}
      >
        <div
          style={{
            position: "relative",
            width: "100%",
            height: "100%",
            transition: "transform 0.55s cubic-bezier(.2,.7,.2,1)",
            transformStyle: "preserve-3d",
            transform: flipped ? "rotateY(180deg)" : "rotateY(0deg)",
          }}
        >
          {/* front */}
          <div
            style={{
              position: "absolute",
              inset: 0,
              backfaceVisibility: "hidden",
              background: "linear-gradient(170deg, #FEFBF3 0%, #F7F1E1 100%)",
              border: "1px solid #e6dcc4",
              borderRadius: "16px",
              boxShadow: "var(--shadow-card)",
              display: "flex",
              flexDirection: "column",
              alignItems: "center",
              justifyContent: "center",
              gap: "18px",
              padding: "28px",
            }}
          >
            <CatChip cat={card.cat} />
            <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: "14px" }}>
              {direction === "de-en" && <SpeakButton text={card.de} />}
              <div
                style={{
                  fontFamily: "var(--font-serif)",
                  fontWeight: 600,
                  fontSize: front.length > 28 ? "20px" : front.length > 16 ? "26px" : "34px",
                  lineHeight: 1.25,
                  letterSpacing: "-0.01em",
                  color: "#2b2620",
                  textAlign: "center",
                }}
              >
                {front}
              </div>
            </div>
            <div style={{ fontFamily: "var(--font-mono)", fontSize: "10px", letterSpacing: "0.16em", textTransform: "uppercase", color: "#b0a888" }}>
              tap to reveal
            </div>
          </div>
          {/* back */}
          <div
            style={{
              position: "absolute",
              inset: 0,
              backfaceVisibility: "hidden",
              transform: "rotateY(180deg)",
              background: `linear-gradient(165deg, ${CATEGORY_META[card.cat].color} 0%, ${CATEGORY_META[card.cat].color}e0 100%)`,
              borderRadius: "16px",
              boxShadow: "var(--shadow-card)",
              display: "flex",
              alignItems: "center",
              justifyContent: "center",
              padding: "28px",
            }}
          >
            <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: "14px" }}>
              {direction === "en-de" && <SpeakButton text={card.de} />}
              <div
                style={{
                  fontFamily: "var(--font-serif)",
                  fontWeight: 600,
                  fontSize: back.length > 28 ? "19px" : "25px",
                  lineHeight: 1.3,
                  letterSpacing: "-0.01em",
                  color: "#FCF8EE",
                  textAlign: "center",
                  textShadow: "0 1px 8px rgba(0,0,0,.18)",
                }}
              >
                {back}
              </div>
            </div>
          </div>
        </div>
      </div>

      <div style={{ display: "flex", gap: "10px" }}>
        <button onClick={prev} style={navBtnStyle}>‹ prev</button>
        <button onClick={reshuffle} style={navBtnStyle}>⟲ shuffle</button>
        <button onClick={next} style={navBtnStyle}>next ›</button>
      </div>

      {flipped && onResult && (
        <div style={{ display: "flex", gap: "10px" }}>
          <button
            onClick={() => { onResult(card.id, false); next(); }}
            style={{ ...navBtnStyle, background: "transparent", color: "#A5354A", border: "1px solid #A5354A", boxShadow: "none" }}
          >
            ✗ review this
          </button>
          <button
            onClick={() => { onResult(card.id, true); next(); }}
            style={{ ...navBtnStyle, background: "transparent", color: "#3F7A55", border: "1px solid #3F7A55", boxShadow: "none" }}
          >
            ✓ knew it
          </button>
        </div>
      )}

      {flipped && <AiSentence card={card} apiKey={geminiKey} />}
    </div>
  );
}

const navBtnStyle = {
  fontFamily: "var(--font-mono)",
  fontSize: "12px",
  fontWeight: 500,
  letterSpacing: "0.08em",
  textTransform: "uppercase",
  padding: "10px 18px",
  borderRadius: "8px",
  border: "1px solid #2b2620",
  background: "linear-gradient(180deg, #35302a 0%, #2b2620 100%)",
  color: "#F6F1E5",
  cursor: "pointer",
  boxShadow: "0 1px 2px rgba(60,50,20,.12), 0 8px 18px -10px rgba(60,50,20,.5)",
};

function makeQuestion(pool, correctPool) {
  const source = correctPool && correctPool.length > 0 ? correctPool : pool;
  const correct = source[Math.floor(Math.random() * source.length)];
  const sameCat = pool.filter((d) => d.cat === correct.cat && d.id !== correct.id);
  const distractPool = (sameCat.length >= 3 ? sameCat : pool.filter((d) => d.id !== correct.id));
  const distractors = shuffle(distractPool).slice(0, 3);
  const options = shuffle([correct, ...distractors]);
  return { correct, options };
}

function Quiz({ pool, allTime, onAnswer, onResult, sessions, onSaveSession, onClearHistory, direction, noRepeat, geminiKey }) {
  const [askedIds, setAskedIds] = useState(() => new Set());
  const [q, setQ] = useState(() => makeQuestion(pool));
  const [picked, setPicked] = useState(null);
  const [score, setScore] = useState({ right: 0, total: 0 });
  const [saved, setSaved] = useState(false);
  const [done, setDone] = useState(false);
  const [historyOpen, setHistoryOpen] = useState(false);

  const resetRound = React.useCallback(() => {
    const fresh = new Set();
    const nq = makeQuestion(pool);
    if (noRepeat) fresh.add(nq.correct.id);
    setAskedIds(fresh);
    setQ(nq);
    setPicked(null);
    setDone(false);
  }, [pool, noRepeat]);

  React.useEffect(() => {
    resetRound();
    setScore({ right: 0, total: 0 });
    setSaved(false);
  }, [pool.length, noRepeat, direction]);

  if (pool.length < 4) {
    return <p style={{ textAlign: "center", color: "#8a8372" }}>Pick at least a couple categories above — need a few options to quiz from.</p>;
  }

  const choose = (opt) => {
    if (picked) return;
    setPicked(opt);
    const correct = opt.id === q.correct.id;
    setScore((s) => ({ right: s.right + (correct ? 1 : 0), total: s.total + 1 }));
    setSaved(false);
    onAnswer && onAnswer(correct);
    onResult && onResult(q.correct.id, correct);
  };

  const nextQ = () => {
    if (noRepeat) {
      const remaining = pool.filter((d) => !askedIds.has(d.id));
      if (remaining.length === 0) {
        setDone(true);
        setPicked(null);
        return;
      }
      const nq = makeQuestion(pool, remaining);
      setAskedIds((prev) => new Set(prev).add(nq.correct.id));
      setQ(nq);
      setPicked(null);
    } else {
      setQ(makeQuestion(pool));
      setPicked(null);
    }
  };

  const finishSession = () => {
    if (score.total === 0) return;
    onSaveSession && onSaveSession(score);
    setSaved(true);
    setScore({ right: 0, total: 0 });
  };

  if (done) {
    return (
      <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: "16px", padding: "40px 0" }}>
        <div style={{ fontFamily: "var(--font-mono)", fontSize: "12px", letterSpacing: "0.1em", color: "#8a8372" }}>
          SCORE {score.right} / {score.total}
        </div>
        <div style={{ fontFamily: "var(--font-serif)", fontSize: "22px", color: "#2b2620", textAlign: "center" }}>
          All {pool.length} / {pool.length} words done 🎉
        </div>
        <div style={{ display: "flex", gap: "10px" }}>
          {score.total > 0 && (
            <button
              onClick={finishSession}
              style={{
                ...navBtnStyle,
                background: saved ? "#3F7A55" : "transparent",
                border: `1px solid ${saved ? "#3F7A55" : "#8a8372"}`,
                color: saved ? "#F6F1E5" : "#8a8372",
              }}
            >
              {saved ? "✓ saved" : "finish & save this round"}
            </button>
          )}
          <button onClick={resetRound} style={navBtnStyle}>⟲ start over</button>
        </div>
      </div>
    );
  }

  return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: "18px" }}>
      <div
        style={{
          fontFamily: "var(--font-mono)",
          fontSize: "12px",
          letterSpacing: "0.1em",
          color: "#8a8372",
        }}
      >
        SCORE {score.right} / {score.total}
        {allTime && allTime.total > 0 && (
          <span style={{ marginLeft: "14px", color: "#b0a888" }}>
            · ALL-TIME {allTime.right} / {allTime.total}
          </span>
        )}
      </div>

      {noRepeat && (
        <div
          style={{
            fontFamily: "var(--font-mono)",
            fontSize: "11px",
            letterSpacing: "0.08em",
            color: "#8a8372",
            marginTop: "-10px",
          }}
        >
          {askedIds.size} / {pool.length} attempted
        </div>
      )}

      <div style={{ textAlign: "center" }}>
        <div style={{ marginBottom: "10px" }}><CatChip cat={q.correct.cat} /></div>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: "14px", flexWrap: "wrap" }}>
          {direction === "de-en" && <SpeakButton text={q.correct.de} />}
          <div style={{ fontFamily: "var(--font-serif)", fontWeight: 600, fontSize: "30px", letterSpacing: "-0.01em", color: "var(--ink)" }}>{promptText(q.correct, direction)}</div>
          {direction === "en-de" && picked && <SpeakButton text={q.correct.de} />}
          {picked && (
            <button onClick={nextQ} style={navBtnStyle}>next ›</button>
          )}
        </div>
      </div>

      <div style={{ display: "flex", flexDirection: "column", gap: "10px", width: "min(420px, 90vw)" }}>
        {q.options.map((opt) => {
          let bg = "var(--paper-raised)";
          let border = "#e2d8c0";
          let color = "var(--ink)";
          let shadow = "var(--shadow-soft)";
          if (picked) {
            if (opt.id === q.correct.id) {
              bg = "linear-gradient(180deg,#458860,#3F7A55)"; border = "#3F7A55"; color = "#F6F1E5";
              shadow = "0 10px 22px -10px rgba(63,122,85,.7)";
            } else if (opt.id === picked.id) {
              bg = "linear-gradient(180deg,#b23c52,#A5354A)"; border = "#A5354A"; color = "#F6F1E5";
              shadow = "0 10px 22px -10px rgba(165,53,74,.7)";
            } else {
              bg = "transparent"; border = "#e2d8c0"; color = "var(--ink-faint)"; shadow = "none";
            }
          }
          const optText = answerText(opt, direction);
          return (
            <button
              key={opt.id}
              onClick={() => choose(opt)}
              style={{
                textAlign: "left",
                fontFamily: "var(--font-serif)",
                fontWeight: 500,
                fontSize: optText.length > 28 ? "14px" : "17px",
                padding: "14px 18px",
                borderRadius: "12px",
                border: `1px solid ${border}`,
                background: bg,
                color,
                boxShadow: shadow,
                cursor: picked ? "default" : "pointer",
              }}
            >
              {optText}
            </button>
          );
        })}
      </div>

      {picked && <AiSentence card={q.correct} apiKey={geminiKey} />}

      {score.total > 0 && (
        <button
          onClick={finishSession}
          style={{
            ...navBtnStyle,
            background: saved ? "#3F7A55" : "transparent",
            border: `1px solid ${saved ? "#3F7A55" : "#8a8372"}`,
            color: saved ? "#F6F1E5" : "#8a8372",
          }}
        >
          {saved ? "✓ saved" : "finish & save this round"}
        </button>
      )}

      {sessions && sessions.length > 0 && (
        <div style={{ width: "min(420px, 90vw)", marginTop: "10px" }}>
          <div
            style={{
              display: "flex",
              alignItems: "center",
              justifyContent: "center",
              gap: "12px",
            }}
          >
            <button
              onClick={() => setHistoryOpen((o) => !o)}
              style={{
                fontFamily: "var(--font-mono)",
                fontSize: "11px",
                letterSpacing: "0.1em",
                color: "#8a8372",
                background: "transparent",
                border: "none",
                padding: 0,
                cursor: "pointer",
              }}
            >
              {historyOpen ? "▾" : "▸"} PAST ROUNDS ({sessions.length})
            </button>
            {historyOpen && onClearHistory && (
              <button
                onClick={() => {
                  if (window.confirm("Clear all saved rounds? This can't be undone.")) onClearHistory();
                }}
                style={{
                  fontFamily: "var(--font-mono)",
                  fontSize: "10px",
                  letterSpacing: "0.08em",
                  textTransform: "uppercase",
                  color: "#A5354A",
                  background: "transparent",
                  border: "1px solid #A5354A",
                  borderRadius: "10px",
                  padding: "2px 8px",
                  cursor: "pointer",
                }}
              >
                clear history
              </button>
            )}
          </div>
          {historyOpen && (
            <div style={{ display: "flex", flexDirection: "column", gap: "6px", marginTop: "10px" }}>
              {sessions.map((s) => {
                const pct = s.total ? Math.round((s.right / s.total) * 100) : 0;
                const d = s.timestamp ? new Date(s.timestamp) : null;
                const dateStr = d
                  ? d.toLocaleDateString(undefined, { month: "short", day: "numeric" }) +
                    " " +
                    d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" })
                  : "";
                return (
                  <div
                    key={s.id}
                    style={{
                      display: "flex",
                      justifyContent: "space-between",
                      fontFamily: "var(--font-mono)",
                      fontSize: "12px",
                      color: "#5a5344",
                      background: "#FBF7EC",
                      border: "1px solid #e4dcc4",
                      borderRadius: "3px",
                      padding: "7px 12px",
                    }}
                  >
                    <span>{dateStr}</span>
                    <span>{s.right}/{s.total} ({pct}%)</span>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

const ARTICLE_OPTIONS = ["der", "die", "das"];
function stripArticle(deText) {
  return deText.replace(/^(der|die|das)\s+/, "");
}
function makeArticleQuestion(nounPool, correctPool) {
  const source = correctPool && correctPool.length > 0 ? correctPool : nounPool;
  const word = source[Math.floor(Math.random() * source.length)];
  return word;
}

function ArticleQuiz({ pool, noRepeat, onResult, geminiKey }) {
  const nounPool = useMemo(() => pool.filter((d) => d.cat === "der" || d.cat === "die" || d.cat === "das"), [pool]);

  const [askedIds, setAskedIds] = useState(() => new Set());
  const [word, setWord] = useState(() => (nounPool.length > 0 ? makeArticleQuestion(nounPool) : null));
  const [picked, setPicked] = useState(null);
  const [score, setScore] = useState({ right: 0, total: 0 });
  const [saved, setSaved] = useState(false);
  const [done, setDone] = useState(false);

  const resetRound = React.useCallback(() => {
    if (nounPool.length === 0) return;
    const w = makeArticleQuestion(nounPool);
    const fresh = new Set();
    if (noRepeat) fresh.add(w.id);
    setAskedIds(fresh);
    setWord(w);
    setPicked(null);
    setDone(false);
  }, [nounPool, noRepeat]);

  React.useEffect(() => {
    resetRound();
    setScore({ right: 0, total: 0 });
    setSaved(false);
  }, [nounPool.length, noRepeat]);

  if (nounPool.length === 0) {
    return <p style={{ textAlign: "center", color: "#8a8372" }}>Select at least one of der / die / das above to practice articles.</p>;
  }
  if (!word) return null;

  const choose = (article) => {
    if (picked) return;
    setPicked(article);
    const correct = article === word.cat;
    setScore((s) => ({ right: s.right + (correct ? 1 : 0), total: s.total + 1 }));
    setSaved(false);
    onResult && onResult(word.id, correct);
  };

  const nextQ = () => {
    if (noRepeat) {
      const remaining = nounPool.filter((d) => !askedIds.has(d.id));
      if (remaining.length === 0) {
        setDone(true);
        setPicked(null);
        return;
      }
      const w = makeArticleQuestion(nounPool, remaining);
      setAskedIds((prev) => new Set(prev).add(w.id));
      setWord(w);
      setPicked(null);
    } else {
      setWord(makeArticleQuestion(nounPool));
      setPicked(null);
    }
  };

  if (done) {
    return (
      <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: "16px", padding: "40px 0" }}>
        <div style={{ fontFamily: "var(--font-mono)", fontSize: "12px", letterSpacing: "0.1em", color: "#8a8372" }}>
          SCORE {score.right} / {score.total}
        </div>
        <div style={{ fontFamily: "var(--font-serif)", fontSize: "22px", color: "#2b2620", textAlign: "center" }}>
          All {nounPool.length} / {nounPool.length} nouns done 🎉
        </div>
        <button onClick={resetRound} style={navBtnStyle}>⟲ start over</button>
      </div>
    );
  }

  const bare = stripArticle(word.de);

  return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: "18px" }}>
      <div
        style={{
          fontFamily: "var(--font-mono)",
          fontSize: "12px",
          letterSpacing: "0.1em",
          color: "#8a8372",
        }}
      >
        SCORE {score.right} / {score.total}
      </div>

      {noRepeat && (
        <div
          style={{
            fontFamily: "var(--font-mono)",
            fontSize: "11px",
            letterSpacing: "0.08em",
            color: "#8a8372",
            marginTop: "-10px",
          }}
        >
          {askedIds.size} / {nounPool.length} attempted
        </div>
      )}

      <div style={{ textAlign: "center" }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: "14px", flexWrap: "wrap" }}>
          <SpeakButton text={picked ? word.de : bare} />
          <div style={{ fontFamily: "var(--font-serif)", fontWeight: 600, fontSize: "34px", letterSpacing: "-0.01em", color: "var(--ink)" }}>{bare}</div>
          {picked && (
            <button onClick={nextQ} style={navBtnStyle}>next ›</button>
          )}
        </div>
        <div style={{ fontFamily: "var(--font-serif)", fontStyle: "italic", fontSize: "15px", color: "var(--ink-soft)", marginTop: "8px" }}>{word.en}</div>
      </div>

      <div style={{ display: "flex", gap: "12px" }}>
        {ARTICLE_OPTIONS.map((art) => {
          const meta = CATEGORY_META[art];
          let bg = meta.color + "0d";
          let color = meta.color;
          let shadow = "none";
          if (picked) {
            if (art === word.cat) { bg = meta.color; color = "#FCF8EE"; shadow = `0 10px 24px -10px ${meta.color}`; }
            else if (art === picked && picked !== word.cat) { bg = "#A5354A"; color = "#FCF8EE"; shadow = "0 10px 24px -10px #A5354A"; }
            else { bg = "transparent"; color = "var(--ink-faint)"; }
          }
          return (
            <button
              key={art}
              onClick={() => choose(art)}
              style={{
                fontFamily: "var(--font-serif)",
                fontWeight: 600,
                fontSize: "21px",
                padding: "14px 30px",
                borderRadius: "12px",
                border: `1.5px solid ${picked && art === word.cat ? meta.color : picked && art === picked ? "#A5354A" : meta.color + "66"}`,
                background: bg,
                color,
                boxShadow: shadow,
                cursor: picked ? "default" : "pointer",
              }}
            >
              {art}
            </button>
          );
        })}
      </div>

      {picked && <AiSentence card={word} apiKey={geminiKey} />}
    </div>
  );
}

// ---------- FILL-IN-THE-BLANK (cloze) ----------
// Uses the hand-written example sentence on each noun card, blanks out the noun,
// and offers 4 same-gender nouns to choose from. Only nouns carry example
// sentences in the data, so this mode works off der / die / das.
const NOUN_CATS = ["der", "die", "das"];
function nounForms(card) {
  let de = String(card.de || "").replace(/\s*\((?:Pl\.|WG)\)/g, "").trim();
  return de
    .split(" / ")
    .map((s) => s.replace(/^(der|die|das)\s+/i, "").trim())
    .filter(Boolean);
}
function clozeMatch(card) {
  const sentence = String(card.example || "");
  if (!sentence) return null;
  for (const f of nounForms(card)) {
    const esc = f.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    const m = sentence.match(new RegExp(esc, "i"));
    if (m) {
      return {
        answer: m[0],
        before: sentence.slice(0, m.index),
        after: sentence.slice(m.index + m[0].length),
      };
    }
  }
  return null;
}
function makeClozeQuestion(pool, correctPool) {
  const source = correctPool && correctPool.length > 0 ? correctPool : pool;
  const correct = source[Math.floor(Math.random() * source.length)];
  const hit = clozeMatch(correct);
  const sameCat = pool.filter((d) => d.cat === correct.cat && d.id !== correct.id);
  const distractPool = sameCat.length >= 3 ? sameCat : pool.filter((d) => d.id !== correct.id);
  const distractors = shuffle(distractPool).slice(0, 3);
  const options = shuffle([correct, ...distractors]).map((d) => ({ id: d.id, label: nounForms(d)[0] }));
  return { correct, hit, options };
}

function ClozeQuiz({ pool, noRepeat, onResult, geminiKey }) {
  const clozePool = useMemo(
    () => pool.filter((d) => NOUN_CATS.includes(d.cat) && d.example && clozeMatch(d)),
    [pool]
  );

  const [askedIds, setAskedIds] = useState(() => new Set());
  const [q, setQ] = useState(() => (clozePool.length > 0 ? makeClozeQuestion(clozePool) : null));
  const [picked, setPicked] = useState(null);
  const [score, setScore] = useState({ right: 0, total: 0 });
  const [done, setDone] = useState(false);

  const resetRound = React.useCallback(() => {
    if (clozePool.length === 0) return;
    const nq = makeClozeQuestion(clozePool);
    const fresh = new Set();
    if (noRepeat) fresh.add(nq.correct.id);
    setAskedIds(fresh);
    setQ(nq);
    setPicked(null);
    setDone(false);
  }, [clozePool, noRepeat]);

  React.useEffect(() => {
    resetRound();
    setScore({ right: 0, total: 0 });
  }, [clozePool.length, noRepeat]);

  if (clozePool.length < 4) {
    return (
      <p style={{ textAlign: "center", color: "var(--ink-soft)", maxWidth: "min(440px, 92vw)", margin: "0 auto", lineHeight: 1.6 }}>
        Fill-in-the-blank runs on example sentences — select <strong>der / die / das</strong> above (and enough nouns) to play.
      </p>
    );
  }
  if (!q) return null;

  const choose = (optId) => {
    if (picked) return;
    setPicked(optId);
    const correct = optId === q.correct.id;
    setScore((s) => ({ right: s.right + (correct ? 1 : 0), total: s.total + 1 }));
    onResult && onResult(q.correct.id, correct);
  };

  const nextQ = () => {
    if (noRepeat) {
      const remaining = clozePool.filter((d) => !askedIds.has(d.id));
      if (remaining.length === 0) {
        setDone(true);
        setPicked(null);
        return;
      }
      const nq = makeClozeQuestion(clozePool, remaining);
      setAskedIds((prev) => new Set(prev).add(nq.correct.id));
      setQ(nq);
      setPicked(null);
    } else {
      setQ(makeClozeQuestion(clozePool));
      setPicked(null);
    }
  };

  if (done) {
    return (
      <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: "16px", padding: "40px 0" }}>
        <div style={{ fontFamily: "var(--font-mono)", fontSize: "12px", letterSpacing: "0.1em", color: "var(--ink-faint)" }}>
          SCORE {score.right} / {score.total}
        </div>
        <div style={{ fontFamily: "var(--font-serif)", fontSize: "22px", color: "var(--ink)", textAlign: "center" }}>
          All {clozePool.length} / {clozePool.length} sentences done 🎉
        </div>
        <button onClick={resetRound} style={navBtnStyle}>⟲ start over</button>
      </div>
    );
  }

  const accent = CATEGORY_META[q.correct.cat].color;

  return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: "18px" }}>
      <div style={{ fontFamily: "var(--font-mono)", fontSize: "12px", letterSpacing: "0.1em", color: "var(--ink-faint)" }}>
        SCORE {score.right} / {score.total}
      </div>

      {noRepeat && (
        <div style={{ fontFamily: "var(--font-mono)", fontSize: "11px", letterSpacing: "0.08em", color: "var(--ink-faint)", marginTop: "-10px" }}>
          {askedIds.size} / {clozePool.length} attempted
        </div>
      )}

      <div
        style={{
          position: "relative",
          width: "min(440px, 92vw)",
          background: "linear-gradient(170deg, #FEFBF3 0%, #F7F1E1 100%)",
          border: "1px solid #e6dcc4",
          borderRadius: "16px",
          boxShadow: "var(--shadow-card)",
          padding: "26px 22px",
          textAlign: "center",
        }}
      >
        {picked && (
          <button
            onClick={nextQ}
            aria-label="next question"
            style={{
              ...navBtnStyle,
              position: "absolute",
              right: "14px",
              top: "18px",
              zIndex: 5,
              padding: "8px 14px",
              fontSize: "11px",
              borderRadius: "999px",
              boxShadow: "0 8px 20px -6px rgba(60,50,20,.7)",
            }}
          >
            next ›
          </button>
        )}
        <div style={{ marginBottom: "16px" }}><CatChip cat={q.correct.cat} /></div>
        <div style={{ fontFamily: "var(--font-serif)", fontWeight: 600, fontSize: "21px", lineHeight: 1.7, color: "var(--ink)" }}>
          {q.hit.before}
          <span
            style={{
              display: "inline-block",
              minWidth: "84px",
              margin: "0 4px",
              padding: "0 8px 2px",
              borderBottom: `2px solid ${picked ? accent : "var(--ink-faint)"}`,
              color: picked ? accent : "transparent",
              fontWeight: 700,
            }}
          >
            {picked ? q.hit.answer : " "}
          </span>
          {q.hit.after}
        </div>
        {picked && (
          <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: "12px", marginTop: "14px" }}>
            <SpeakButton text={(q.hit.before + q.hit.answer + q.hit.after).trim() || q.correct.de} size={30} />
            <div style={{ fontFamily: "var(--font-serif)", fontStyle: "italic", fontSize: "14px", color: "var(--ink-soft)" }}>
              {q.correct.de} · {q.correct.en}
            </div>
          </div>
        )}
      </div>

      <div style={{ display: "flex", flexDirection: "column", gap: "10px", width: "min(440px, 92vw)" }}>
        {q.options.map((opt) => {
          let bg = "var(--paper-raised)";
          let border = "#e2d8c0";
          let color = "var(--ink)";
          let shadow = "var(--shadow-soft)";
          if (picked) {
            if (opt.id === q.correct.id) {
              bg = "linear-gradient(180deg,#458860,#3F7A55)"; border = "#3F7A55"; color = "#FCF8EE";
              shadow = "0 10px 22px -10px rgba(63,122,85,.7)";
            } else if (opt.id === picked) {
              bg = "linear-gradient(180deg,#b23c52,#A5354A)"; border = "#A5354A"; color = "#FCF8EE";
              shadow = "0 10px 22px -10px rgba(165,53,74,.7)";
            } else {
              bg = "transparent"; border = "#e2d8c0"; color = "var(--ink-faint)"; shadow = "none";
            }
          }
          return (
            <button
              key={opt.id}
              onClick={() => choose(opt.id)}
              style={{
                fontFamily: "var(--font-serif)",
                fontWeight: 600,
                fontSize: opt.label.length > 22 ? "15px" : "18px",
                textAlign: "center",
                padding: "14px 16px",
                borderRadius: "12px",
                border: `1px solid ${border}`,
                background: bg,
                color,
                boxShadow: shadow,
                cursor: picked ? "default" : "pointer",
              }}
            >
              {opt.label}
            </button>
          );
        })}
      </div>

      {picked && <AiSentence card={q.correct} apiKey={geminiKey} />}
    </div>
  );
}

// ---------- REVIEW (re-test past mistakes) ----------
// Drills the words in `mistakes` — anything missed in Quiz / Articles / Fill-in,
// or flagged with "✗ review this" on a flashcard. Same 4-option meaning test as
// Quiz; a word leaves the list once answered right REVIEW_CLEARS times, and any
// fresh miss (in this tab or elsewhere) resets it. The list ignores the level /
// category filters so mistakes never silently disappear from view.
function MistakesReview({ mistakes, allData, direction, onResult, onClearAll, geminiKey }) {
  const byId = useMemo(() => Object.fromEntries(allData.map((d) => [d.id, d])), [allData]);

  // Snapshot the list at mount (the tab remounts on every switch via key={mode}),
  // so clearing a word mid-round doesn't reshuffle the remaining questions.
  const [queue, setQueue] = useState(() =>
    shuffle(Object.keys(mistakes).map(Number).filter((id) => byId[id]))
  );
  const [pos, setPos] = useState(0);
  const [picked, setPicked] = useState(null);
  const [results, setResults] = useState({});
  const [roundKey, setRoundKey] = useState(0);

  const startRound = React.useCallback(
    (ids) => {
      const base = (ids && ids.length ? ids : Object.keys(mistakes).map(Number)).filter((id) => byId[id]);
      setQueue(shuffle(base));
      setPos(0);
      setPicked(null);
      setResults({});
      setRoundKey((k) => k + 1);
    },
    [mistakes, byId]
  );

  const card = byId[queue[pos]];
  const options = useMemo(() => {
    if (!card) return [];
    const sameCat = allData.filter((d) => d.cat === card.cat && d.id !== card.id);
    const distractPool = sameCat.length >= 3 ? sameCat : allData.filter((d) => d.id !== card.id);
    return shuffle([card, ...shuffle(distractPool).slice(0, 3)]);
  }, [card, allData, pos, roundKey]);

  const total = Object.keys(mistakes).length;

  if (total === 0) {
    return (
      <p style={{ textAlign: "center", color: "var(--ink-soft)", maxWidth: "min(440px, 92vw)", margin: "0 auto", lineHeight: 1.7 }}>
        Nothing to review yet. Words you miss in <strong>Quiz</strong>, <strong>Articles</strong> or <strong>Fill-in</strong> — or flag with <strong>✗&nbsp;review&nbsp;this</strong> on a card — collect here so you can drill them until they stick.
      </p>
    );
  }

  const done = pos >= queue.length;
  if (done) {
    const answered = Object.keys(results).length;
    const gotRight = Object.values(results).filter(Boolean).length;
    const stillTricky = queue.filter((id) => mistakes[id]);
    return (
      <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: "16px", padding: "32px 0" }}>
        <div style={{ fontFamily: "var(--font-mono)", fontSize: "12px", letterSpacing: "0.1em", color: "var(--ink-faint)" }}>
          THIS ROUND {gotRight} / {answered} right
        </div>
        <div style={{ fontFamily: "var(--font-serif)", fontSize: "22px", color: "var(--ink)", textAlign: "center" }}>
          {`${total} word${total === 1 ? "" : "s"} still on the list`}
        </div>
        <div style={{ display: "flex", gap: "10px", flexWrap: "wrap", justifyContent: "center" }}>
          {stillTricky.length > 0 && (
            <button onClick={() => startRound(stillTricky)} style={navBtnStyle}>↻ keep drilling ({stillTricky.length})</button>
          )}
          <button onClick={() => startRound()} style={navBtnStyle}>⟲ review all {total}</button>
        </div>
      </div>
    );
  }

  if (!card) {
    return (
      <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: "16px", padding: "32px 0" }}>
        <button onClick={() => startRound()} style={navBtnStyle}>⟲ restart review</button>
      </div>
    );
  }

  const choose = (opt) => {
    if (picked) return;
    setPicked(opt);
    const correct = opt.id === card.id;
    setResults((r) => ({ ...r, [card.id]: correct }));
    onResult && onResult(card.id, correct);
  };
  const next = () => {
    setPicked(null);
    setPos((p) => p + 1);
  };

  const info = mistakes[card.id] || {};
  const clearsLeft = Math.max(0, REVIEW_CLEARS - (info.cleared || 0));

  return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: "18px" }}>
      <div style={{ fontFamily: "var(--font-mono)", fontSize: "12px", letterSpacing: "0.1em", color: "var(--ink-faint)" }}>
        REVIEW {pos + 1} / {queue.length}
        <span style={{ marginLeft: "14px", color: "#b0a888" }}>· {total} on list</span>
      </div>

      <div style={{ textAlign: "center" }}>
        <div style={{ marginBottom: "10px" }}><CatChip cat={card.cat} /></div>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: "14px", flexWrap: "wrap" }}>
          {direction === "de-en" && <SpeakButton text={card.de} />}
          <div style={{ fontFamily: "var(--font-serif)", fontWeight: 600, fontSize: "30px", letterSpacing: "-0.01em", color: "var(--ink)" }}>
            {promptText(card, direction)}
          </div>
          {direction === "en-de" && picked && <SpeakButton text={card.de} />}
          {picked && <button onClick={next} style={navBtnStyle}>next ›</button>}
        </div>
        <div style={{ fontFamily: "var(--font-mono)", fontSize: "10px", letterSpacing: "0.12em", textTransform: "uppercase", color: "var(--ink-faint)", marginTop: "10px" }}>
          {info.wrong ? `missed ${info.wrong}×  ·  ` : ""}{clearsLeft} more correct to clear
        </div>
      </div>

      <div style={{ display: "flex", flexDirection: "column", gap: "10px", width: "min(420px, 90vw)" }}>
        {options.map((opt) => {
          let bg = "var(--paper-raised)";
          let border = "#e2d8c0";
          let color = "var(--ink)";
          let shadow = "var(--shadow-soft)";
          if (picked) {
            if (opt.id === card.id) {
              bg = "linear-gradient(180deg,#458860,#3F7A55)"; border = "#3F7A55"; color = "#F6F1E5";
              shadow = "0 10px 22px -10px rgba(63,122,85,.7)";
            } else if (opt.id === picked.id) {
              bg = "linear-gradient(180deg,#b23c52,#A5354A)"; border = "#A5354A"; color = "#F6F1E5";
              shadow = "0 10px 22px -10px rgba(165,53,74,.7)";
            } else {
              bg = "transparent"; border = "#e2d8c0"; color = "var(--ink-faint)"; shadow = "none";
            }
          }
          const optText = answerText(opt, direction);
          return (
            <button
              key={opt.id}
              onClick={() => choose(opt)}
              style={{
                textAlign: "left",
                fontFamily: "var(--font-serif)",
                fontWeight: 500,
                fontSize: optText.length > 28 ? "14px" : "17px",
                padding: "14px 18px",
                borderRadius: "12px",
                border: `1px solid ${border}`,
                background: bg,
                color,
                boxShadow: shadow,
                cursor: picked ? "default" : "pointer",
              }}
            >
              {optText}
            </button>
          );
        })}
      </div>

      {picked && <AiSentence card={card} apiKey={geminiKey} />}

      <button
        onClick={() => {
          if (window.confirm("Clear the whole review list?")) onClearAll();
        }}
        style={{
          fontFamily: "var(--font-mono)", fontSize: "10px", letterSpacing: "0.08em", textTransform: "uppercase",
          color: "#A5354A", background: "transparent", border: "1px solid #A5354A", borderRadius: "10px",
          padding: "4px 10px", cursor: "pointer",
        }}
      >
        clear review list
      </button>
    </div>
  );
}

// ---------- TRENNBARE VERBEN (separable verbs) ----------
// Drills the mechanic that trips learners up: the separable prefix jumps to the
// end of the clause. We show the sentence with the prefix blanked out and ask
// which prefix belongs there.
const SEP_PREFIXES = [
  "auf", "an", "aus", "ein", "mit", "nach", "vor", "zu", "ab", "um",
  "zurück", "weg", "hin", "her", "fest", "los", "teil", "statt", "durch",
  "heraus", "zusammen", "vorbei", "fern", "bei", "mit",
];
const SEP_COMMON = ["auf", "an", "aus", "ein", "mit", "nach", "vor", "zu", "ab", "um"];

function sepParts(card) {
  let de = String(card.de || "").trim();
  de = de.replace(/^sich\s+/i, "").replace(/\s+(mit|auf|an|über|für|zu|nach|von|in|bei|um)$/i, "").trim();
  const inf = de.split(" ")[0] || de;
  const prefix = String(
    card.prefix || SEP_PREFIXES.find((p) => inf.toLowerCase().startsWith(p)) || ""
  ).toLowerCase();
  return { inf, prefix };
}

function sepCloze(card, prefix) {
  const ex = String(card.example || "").trim();
  if (!ex || !prefix) return null;
  const esc = prefix.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const re = new RegExp("(^|[\\s(])(" + esc + ")(?=[\\s.,!?;:)]|$)", "gi");
  let m, last = null;
  while ((m = re.exec(ex))) last = m;
  if (!last) return null;
  const at = last.index + last[1].length;
  return { before: ex.slice(0, at), after: ex.slice(at + prefix.length), answer: ex.substr(at, prefix.length) };
}

function makeSepQuestion(playable, avoidId) {
  if (!playable || playable.length === 0) return null;
  const src = playable.length > 1 && avoidId != null ? playable.filter((d) => d.id !== avoidId) : playable;
  const card = src[Math.floor(Math.random() * src.length)];
  const { prefix } = sepParts(card);
  const cloze = sepCloze(card, prefix);
  const distractors = shuffle(SEP_COMMON.filter((p) => p !== prefix)).slice(0, 3);
  const options = shuffle([prefix, ...distractors]);
  return { card, answer: prefix, cloze, options };
}

function SeparableVerbs({ pool, onResult, geminiKey }) {
  const playable = useMemo(() => {
    return pool.filter((d) => {
      if (d.cat !== "sep") return false;
      const { prefix } = sepParts(d);
      return prefix && sepCloze(d, prefix);
    });
  }, [pool]);

  const [q, setQ] = useState(() => makeSepQuestion(playable));
  const [picked, setPicked] = useState(null);
  const [score, setScore] = useState({ right: 0, total: 0 });

  React.useEffect(() => {
    setQ(makeSepQuestion(playable));
    setPicked(null);
    setScore({ right: 0, total: 0 });
  }, [playable.length]);

  if (playable.length < 4) {
    return (
      <p style={{ textAlign: "center", color: "var(--ink-soft)", maxWidth: "min(440px, 92vw)", margin: "0 auto", lineHeight: 1.7 }}>
        Not enough separable verbs in the current selection — turn on the <strong>trenn.</strong> category (and a level or two) in settings ▸.
      </p>
    );
  }
  if (!q || !q.cloze) return null;

  const { inf } = sepParts(q.card);

  const choose = (opt) => {
    if (picked) return;
    setPicked(opt);
    const correct = opt === q.answer;
    setScore((s) => ({ right: s.right + (correct ? 1 : 0), total: s.total + 1 }));
    onResult && onResult(q.card.id, correct);
  };
  const nextQ = () => {
    setQ(makeSepQuestion(playable, q.card.id));
    setPicked(null);
  };

  const accent = CATEGORY_META.sep.color;

  return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: "18px" }}>
      <div style={{ fontFamily: "var(--font-mono)", fontSize: "12px", letterSpacing: "0.1em", color: "var(--ink-faint)" }}>
        SCORE {score.right} / {score.total}
        <span style={{ marginLeft: "12px", color: "#b0a888" }}>· {playable.length} verbs</span>
      </div>

      <div
        style={{
          position: "relative",
          width: "min(440px, 92vw)",
          background: "linear-gradient(170deg, #FEFBF3 0%, #F7F1E1 100%)",
          border: "1px solid #e6dcc4",
          borderRadius: "16px",
          boxShadow: "var(--shadow-card)",
          padding: "26px 22px",
          textAlign: "center",
        }}
      >
        {picked && (
          <button
            onClick={nextQ}
            aria-label="next question"
            style={{
              ...navBtnStyle,
              position: "absolute", right: "14px", top: "18px", zIndex: 5,
              padding: "8px 14px", fontSize: "11px", borderRadius: "999px",
              boxShadow: "0 8px 20px -6px rgba(60,50,20,.7)",
            }}
          >
            next ›
          </button>
        )}
        <div style={{ marginBottom: "14px" }}><CatChip cat="sep" /></div>
        <div style={{ fontFamily: "var(--font-serif)", fontStyle: "italic", fontSize: "15px", color: "var(--ink-soft)", marginBottom: "12px" }}>
          {picked ? `${inf} — ${q.card.en}` : q.card.en}
        </div>
        <div style={{ fontFamily: "var(--font-serif)", fontWeight: 600, fontSize: "21px", lineHeight: 1.7, color: "var(--ink)" }}>
          {q.cloze.before}
          <span
            style={{
              display: "inline-block", minWidth: "68px", margin: "0 4px", padding: "0 8px 2px",
              borderBottom: `2px solid ${picked ? accent : "var(--ink-faint)"}`,
              color: picked ? accent : "transparent", fontWeight: 700,
            }}
          >
            {picked ? q.cloze.answer : " "}
          </span>
          {q.cloze.after}
        </div>
        {picked && (
          <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: "12px", marginTop: "14px" }}>
            <SpeakButton text={(q.cloze.before + q.cloze.answer + q.cloze.after).trim() || q.card.example} size={30} />
            <div style={{ fontFamily: "var(--font-mono)", fontSize: "10px", letterSpacing: "0.12em", textTransform: "uppercase", color: picked === q.answer ? "#3F7A55" : "#A5354A" }}>
              {picked === q.answer ? "richtig" : `→ ${q.answer}`}
            </div>
          </div>
        )}
      </div>

      <div style={{ fontFamily: "var(--font-mono)", fontSize: "10px", letterSpacing: "0.12em", textTransform: "uppercase", color: "var(--ink-faint)" }}>
        which prefix goes in the gap?
      </div>

      <div style={{ display: "flex", gap: "10px", flexWrap: "wrap", justifyContent: "center", width: "min(440px, 92vw)" }}>
        {q.options.map((opt) => {
          const meta = CATEGORY_META.sep;
          let bg = meta.color + "0d";
          let color = meta.color;
          let border = meta.color + "66";
          let shadow = "none";
          if (picked) {
            if (opt === q.answer) { bg = meta.color; color = "#FCF8EE"; border = meta.color; shadow = `0 10px 24px -10px ${meta.color}`; }
            else if (opt === picked) { bg = "#A5354A"; color = "#FCF8EE"; border = "#A5354A"; shadow = "0 10px 24px -10px #A5354A"; }
            else { bg = "transparent"; color = "var(--ink-faint)"; border = "#e2d8c0"; }
          }
          return (
            <button
              key={opt}
              onClick={() => choose(opt)}
              style={{
                fontFamily: "var(--font-serif)", fontWeight: 600, fontSize: "19px",
                padding: "12px 24px", borderRadius: "12px",
                border: `1.5px solid ${border}`, background: bg, color, boxShadow: shadow,
                cursor: picked ? "default" : "pointer",
              }}
            >
              {opt}
            </button>
          );
        })}
      </div>

      {picked && <AiSentence card={q.card} apiKey={geminiKey} />}
    </div>
  );
}

// ---------- TAB BAR ----------
// Horizontally scrollable on narrow screens (iOS momentum scroll, snap points),
// and collapsible: the ‹ toggle retracts the whole strip to the left so only the
// current tab shows while you're focused on learning.
const TABS = [
  { id: "flash", label: "Cards" },
  { id: "quiz", label: "Quiz" },
  { id: "articles", label: "Articles" },
  { id: "sep", label: "Trennbare Verben" },
  { id: "cloze", label: "Fill-in" },
  { id: "mistakes", label: "Review" },
];

function TabBar({ mode, setMode, mistakeCount }) {
  const [open, setOpen] = useState(true);
  const stripRef = React.useRef(null);
  const active = TABS.find((t) => t.id === mode) || TABS[0];

  React.useEffect(() => {
    if (!open || !stripRef.current) return;
    const el = stripRef.current.querySelector('[data-on="1"]');
    if (el && el.scrollIntoView) el.scrollIntoView({ inline: "center", block: "nearest", behavior: "smooth" });
  }, [mode, open]);

  const tabLabel = (t) => (t.id === "mistakes" && mistakeCount ? `${t.label} ${mistakeCount}` : t.label);
  const pill = (on, isMistakes) => ({
    flex: "0 0 auto",
    scrollSnapAlign: "center",
    whiteSpace: "nowrap",
    fontFamily: "var(--font-mono)",
    fontSize: "10px",
    fontWeight: 500,
    letterSpacing: "0.05em",
    textTransform: "uppercase",
    padding: "9px 15px",
    border: "none",
    borderRadius: "999px",
    background: on ? "linear-gradient(180deg, #35302a 0%, #2b2620 100%)" : "transparent",
    color: on ? "#FCF8EE" : isMistakes && mistakeCount ? "#A5354A" : "var(--ink-soft)",
    boxShadow: on ? "0 6px 16px -8px rgba(60,50,20,.55)" : "none",
    cursor: "pointer",
  });

  return (
    <div style={{ display: "flex", alignItems: "center", gap: "6px", width: "min(460px, 94vw)", alignSelf: "center" }}>
      <button
        onClick={() => setOpen((o) => !o)}
        aria-label={open ? "collapse tabs" : "expand tabs"}
        aria-expanded={open}
        style={{
          flexShrink: 0, width: "34px", height: "34px", borderRadius: "999px",
          fontFamily: "var(--font-mono)", fontSize: "13px", lineHeight: 1,
          border: "1px solid var(--line)", background: "var(--paper-raised)",
          color: "var(--ink-soft)", cursor: "pointer",
        }}
      >
        {open ? "‹" : "›"}
      </button>

      {!open && (
        <button onClick={() => setOpen(true)} style={{ ...pill(true, false), padding: "9px 18px" }}>
          {tabLabel(active)}
        </button>
      )}

      <div
        ref={stripRef}
        className="tabstrip"
        style={{
          display: "flex",
          gap: "3px",
          alignItems: "center",
          flex: 1,
          minWidth: 0,
          padding: open ? "3px" : "0",
          background: open ? "#00000008" : "transparent",
          border: `1px solid ${open ? "var(--line)" : "transparent"}`,
          borderRadius: "999px",
          overflowX: "auto",
          scrollSnapType: "x proximity",
          maxWidth: open ? "1200px" : "0px",
          opacity: open ? 1 : 0,
          pointerEvents: open ? "auto" : "none",
          transition: "max-width .34s cubic-bezier(.4,0,.2,1), opacity .18s ease, padding .2s ease",
        }}
      >
        {TABS.map((t) => {
          const on = mode === t.id;
          return (
            <button key={t.id} data-on={on ? "1" : "0"} onClick={() => setMode(t.id)} style={pill(on, t.id === "mistakes")}>
              {tabLabel(t)}
            </button>
          );
        })}
      </div>
    </div>
  );
}

// A single fixed record shared by every browser/device — since this trainer
// is for one person only, there's no need for a separate identity per browser.
const PROGRESS_DOC_ID = "harsimar-progress";
function App() {
  const [mode, setMode] = useState("flash");
  const [activeCats, setActiveCats] = useState(CATS);
  const [levels, setLevels] = useState(["A2"]);
  const [direction, setDirection] = useState("de-en");
  const [noRepeat, setNoRepeat] = useState(false);
  const [settingsOpen, setSettingsOpen] = useState(false);
  const [ready, setReady] = useState(false);
  const [allTime, setAllTime] = useState({ right: 0, total: 0 });
  const [sessions, setSessions] = useState([]);

  // Words to re-test in the Review tab: { [cardId]: { wrong, cleared, ts } }.
  // Kept in localStorage — this trainer is single-user and the list is small.
  const [mistakes, setMistakes] = useState(() => {
    try {
      return JSON.parse(localStorage.getItem("a2vocab.mistakes.v1")) || {};
    } catch (e) {
      return {};
    }
  });
  React.useEffect(() => {
    try {
      localStorage.setItem("a2vocab.mistakes.v1", JSON.stringify(mistakes));
    } catch (e) {
      /* storage disabled / full — review list just won't persist */
    }
  }, [mistakes]);

  // Optional Google AI (Gemini) key for on-demand example sentences. Browser-only.
  const [geminiKey, setGeminiKey] = useState(() => {
    try {
      return localStorage.getItem("a2vocab.geminiKey.v1") || "";
    } catch (e) {
      return "";
    }
  });
  React.useEffect(() => {
    try {
      if (geminiKey) localStorage.setItem("a2vocab.geminiKey.v1", geminiKey);
      else localStorage.removeItem("a2vocab.geminiKey.v1");
    } catch (e) {
      /* storage disabled — key just won't persist between reloads */
    }
  }, [geminiKey]);

  // Vocabulary is fetched at startup from VOCAB_DATA_URL rather than bundled here.
  const [allData, setAllData] = useState(null); // null while loading
  const [dataError, setDataError] = useState(null);
  const [loadAttempt, setLoadAttempt] = useState(0);

  const toggleCat = useCallback((c) => {
    setActiveCats((prev) => (prev.includes(c) ? prev.filter((x) => x !== c) : [...prev, c]));
  }, []);

  const toggleLevel = useCallback((lv) => {
    setLevels((prev) => {
      if (prev.includes(lv)) {
        // keep at least one level selected
        return prev.length === 1 ? prev : prev.filter((x) => x !== lv);
      }
      return LEVELS.filter((x) => x === lv || prev.includes(x));
    });
  }, []);

  React.useEffect(() => {
    let cancelled = false;
    setAllData(null);
    setDataError(null);
    const fetchJson = (url) =>
      fetch(url).then((res) => {
        if (!res.ok) throw new Error(`HTTP ${res.status} fetching vocab data`);
        return res.json();
      });
    fetchJson(VOCAB_DATA_URL)
      .catch(() => fetchJson(VOCAB_DATA_URL_FALLBACK))
      .then((json) => {
        if (cancelled) return;
        const items = buildDataFromJson(json);
        if (!items.length) throw new Error("Vocab data loaded but contained no entries");
        setAllData(items);
      })
      .catch((err) => {
        if (cancelled) return;
        console.error("Failed to load vocab data:", err);
        setDataError((err && err.message) || String(err));
      });
    return () => {
      cancelled = true;
    };
  }, [loadAttempt]);

  const levelData = useMemo(() => (allData ? allData.filter((d) => levels.includes(d.lvl)) : []), [allData, levels]);
  const pool = useMemo(() => levelData.filter((d) => activeCats.includes(d.cat)), [levelData, activeCats]);
  const mistakeCount = Object.keys(mistakes).length;

  // One handler feeds the review list from every mode: a miss adds/refreshes the
  // word, a hit chips away at it until it's cleared out.
  const recordResult = useCallback((cardId, correct) => {
    setMistakes((prev) => {
      const cur = prev[cardId];
      if (correct) {
        if (!cur) return prev; // not on the list — nothing to track
        const cleared = (cur.cleared || 0) + 1;
        if (cleared >= REVIEW_CLEARS) {
          const nextState = { ...prev };
          delete nextState[cardId];
          return nextState;
        }
        return { ...prev, [cardId]: { ...cur, cleared } };
      }
      return {
        ...prev,
        [cardId]: { wrong: ((cur && cur.wrong) || 0) + 1, cleared: 0, ts: Date.now() },
      };
    });
  }, []);

  const clearAllMistakes = useCallback(() => setMistakes({}), []);

  const loadSessions = useCallback(() => {
    const fb = getFirebase();
    if (!fb) return;
    fb.db
      .collection("scores").doc(PROGRESS_DOC_ID).collection("sessions")
      .orderBy("timestamp", "desc")
      .limit(15)
      .get()
      .then((qs) => {
        setSessions(qs.docs.map((d) => ({ id: d.id, ...d.data() })));
      })
      .catch((err) => console.error("loadSessions failed:", err.code || err.message || err));
  }, []);

  // Sign in anonymously (required by the security rules) then load the one shared record
  React.useEffect(() => {
    const fb = getFirebase();
    if (!fb) return; // Firebase SDK not loaded — app still works, just no persistence
    const unsub = fb.auth.onAuthStateChanged((user) => {
      if (user) {
        setReady(true);
        fb.db.collection("scores").doc(PROGRESS_DOC_ID).get().then((snap) => {
          if (snap.exists) {
            const d = snap.data();
            setAllTime({ right: d.right || 0, total: d.total || 0 });
          }
        }).catch((err) => console.error("load allTime failed:", err.code || err.message || err));
        loadSessions();
      }
    });
    fb.auth.signInAnonymously().catch(() => {});
    return () => unsub && unsub();
  }, [loadSessions]);

  const handleAnswer = useCallback((correct) => {
    setAllTime((prev) => {
      const next = { right: prev.right + (correct ? 1 : 0), total: prev.total + 1 };
      const fb = getFirebase();
      if (fb && ready) {
        fb.db.collection("scores").doc(PROGRESS_DOC_ID).set(
          {
            right: window.firebase.firestore.FieldValue.increment(correct ? 1 : 0),
            total: window.firebase.firestore.FieldValue.increment(1),
          },
          { merge: true }
        ).catch((err) => console.error("save allTime failed:", err.code || err.message || err));
      }
      return next;
    });
  }, [ready]);

  const handleSaveSession = useCallback((score) => {
    const fb = getFirebase();
    if (!fb || !ready) return;
    const record = { right: score.right, total: score.total, cats: activeCats, timestamp: Date.now() };
    fb.db
      .collection("scores").doc(PROGRESS_DOC_ID).collection("sessions")
      .add(record)
      .then(() => loadSessions())
      .catch((err) => console.error("save session failed:", err.code || err.message || err));
  }, [ready, activeCats, loadSessions]);

  const handleClearHistory = useCallback(() => {
    const fb = getFirebase();
    if (!fb || !ready) return;
    const sessionsRef = fb.db.collection("scores").doc(PROGRESS_DOC_ID).collection("sessions");
    sessionsRef
      .get()
      .then((qs) => {
        const batch = fb.db.batch();
        qs.docs.forEach((d) => batch.delete(d.ref));
        return batch.commit();
      })
      .then(() => setSessions([]))
      .catch((err) => console.error("clear history failed:", err.code || err.message || err));
  }, [ready]);

  const shellStyle = {
    minHeight: "100%",
    padding: "36px 20px 48px",
    fontFamily: "var(--font-serif)",
    display: "flex",
    alignItems: "center",
    justifyContent: "center",
  };

  if (dataError) {
    return (
      <div style={shellStyle}>
        <div style={{ maxWidth: "420px", textAlign: "center", display: "flex", flexDirection: "column", gap: "16px" }}>
          <div style={{ fontSize: "22px", color: "#2b2620" }}>Couldn't load the vocabulary</div>
          <div style={{ fontFamily: "var(--font-mono)", fontSize: "12px", color: "#A5354A" }}>{dataError}</div>
          <div style={{ fontSize: "13px", color: "#8a8372" }}>
            Checked <code>{VOCAB_DATA_URL}</code>
          </div>
          <button onClick={() => setLoadAttempt((n) => n + 1)} style={navBtnStyle}>⟲ retry</button>
        </div>
      </div>
    );
  }

  if (!allData) {
    return (
      <div style={shellStyle}>
        <div style={{ fontFamily: "var(--font-mono)", fontSize: "13px", letterSpacing: "0.1em", color: "#8a8372" }}>
          loading vocabulary …
        </div>
      </div>
    );
  }

  return (
    <div
      style={{
        minHeight: "100%",
        padding: "44px 20px 56px",
        fontFamily: "var(--font-serif)",
      }}
    >
      <div style={{ maxWidth: "560px", margin: "0 auto", display: "flex", flexDirection: "column", gap: "18px" }}>
        <div style={{ textAlign: "center" }}>
          <div
            style={{
              display: "inline-block",
              fontFamily: "var(--font-mono)",
              fontSize: "9px",
              letterSpacing: "0.16em",
              textTransform: "uppercase",
              color: "var(--ink-faint)",
              border: "1px solid var(--line)",
              borderRadius: "999px",
              padding: "3px 11px",
              marginBottom: "14px",
            }}
          >
            ⇣ data fetched from JSON file
          </div>
          <div style={{ fontFamily: "var(--font-mono)", fontSize: "10px", fontWeight: 500, letterSpacing: "0.28em", color: "var(--accent)", marginBottom: "8px" }}>
            {levels.length === 1
              ? `${levels[0]} · ${LEVEL_META[levels[0]]}`
              : LEVELS.filter((lv) => levels.includes(lv)).join("  +  ")}
          </div>
           <div style={{ fontSize: "13px", fontStyle: "italic", color: "var(--ink-soft)", marginTop: "8px" }}>
            {levelData.length} cards — nouns, verbs, separable verbs, adjectives, connectors &amp; phrases
          </div>
          <div style={{ width: "48px", height: "2px", background: "var(--accent)", opacity: 0.5, borderRadius: "2px", margin: "18px auto 0" }} />
        </div>

        <div style={{ textAlign: "center" }}>
          <button
            onClick={() => setSettingsOpen((o) => !o)}
            style={{
              fontFamily: "var(--font-mono)",
              fontSize: "10px",
              letterSpacing: "0.1em",
              textTransform: "uppercase",
              color: "var(--ink-soft)",
              background: settingsOpen ? "#00000008" : "transparent",
              border: "1px solid var(--line)",
              borderRadius: "999px",
              padding: "8px 16px",
              cursor: "pointer",
              maxWidth: "100%",
            }}
          >
            {settingsOpen ? "▾" : "▸"} {LEVELS.filter((lv) => levels.includes(lv)).join("+")} · {activeCats.length === CATS.length ? "all categories" : `${activeCats.length}/${CATS.length} categories`} · {direction === "de-en" ? "DE→EN" : "EN→DE"}
            {noRepeat ? " · no repeats" : ""}
            {geminiKey ? " · ✨ AI" : ""}
          </button>
        </div>

        {settingsOpen && (
          <div style={{ display: "flex", flexDirection: "column", gap: "14px" }}>
            <LevelToggle levels={levels} onToggle={toggleLevel} />
            <FilterBar active={activeCats} onToggle={toggleCat} />
            <div style={{ display: "flex", justifyContent: "center", gap: "10px", flexWrap: "wrap" }}>
              <DirectionToggle direction={direction} onChange={setDirection} />
              <NoRepeatToggle noRepeat={noRepeat} onChange={setNoRepeat} />
            </div>
            <GeminiKeyField value={geminiKey} onChange={setGeminiKey} />
          </div>
        )}

        <TabBar mode={mode} setMode={setMode} mistakeCount={mistakeCount} />

        <div style={{ marginTop: "6px", animation: "cardIn .35s ease both" }} key={mode}>
          {mode === "flash" && <Flashcards pool={pool} allData={allData} direction={direction} noRepeat={noRepeat} onResult={recordResult} geminiKey={geminiKey} />}
          {mode === "quiz" && <Quiz pool={pool} allTime={allTime} onAnswer={handleAnswer} onResult={recordResult} sessions={sessions} onSaveSession={handleSaveSession} onClearHistory={handleClearHistory} direction={direction} noRepeat={noRepeat} geminiKey={geminiKey} />}
          {mode === "articles" && <ArticleQuiz pool={pool} noRepeat={noRepeat} onResult={recordResult} geminiKey={geminiKey} />}
          {mode === "sep" && <SeparableVerbs pool={pool} onResult={recordResult} geminiKey={geminiKey} />}
          {mode === "cloze" && <ClozeQuiz pool={pool} noRepeat={noRepeat} onResult={recordResult} geminiKey={geminiKey} />}
          {mode === "mistakes" && <MistakesReview mistakes={mistakes} allData={allData} direction={direction} onResult={recordResult} onClearAll={clearAllMistakes} geminiKey={geminiKey} />}
        </div>
      </div>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
