const CATEGORY_META = {
  der: { label: "der", color: "#3A5A8C" },
  die: { label: "die", color: "#A5354A" },
  das: { label: "das", color: "#3F7A55" },
  adj: { label: "adj.", color: "#8A6A2B" },
  verb: { label: "verb", color: "#6B4A8A" },
  func: { label: "func.", color: "#4A7A8C" },
  phrase: { label: "phrase", color: "#B0722E" },
};

// ---------- DATA: fetched at runtime from a hosted JSON file ----------
// The vocabulary itself (nouns/verbs/adjectives/connectors/phrases for A1/A2/B1)
// is no longer bundled in this file. It's fetched from VOCAB_DATA_URL on startup
// (see App below) and flattened here into the same {id, de, en, cat, lvl, example}
// shape the rest of the app already expects, so everything below this point is
// unchanged from when the data was hardcoded.
const VOCAB_DATA_URL = "https://harsimar17.github.io/a2-vocab-trainer/german_vocab.json";

// Expected JSON shape:
// { levels: { A1|A2|B1: {
//     nouns: { der: [{de,en,example}], die: [...], das: [...] },
//     adjectives: [{de,en}], verbs: [{de,en}],
//     function_words: [{de,en}], phrases: [{de,en}]
// } } }
function buildDataFromJson(json) {
  const items = [];
  let id = 0;
  const levels = ["A1", "A2", "B1"];
  const nounCats = ["der", "die", "das"];
  const plainCats = { adjectives: "adj", verbs: "verb", function_words: "func", phrases: "phrase" };

  levels.forEach((lvl) => {
    const levelData = json && json.levels && json.levels[lvl];
    if (!levelData) return;

    const nouns = levelData.nouns || {};
    nounCats.forEach((art) => {
      (nouns[art] || []).forEach((entry) => {
        items.push({ id: id++, de: entry.de, en: entry.en, cat: art, lvl, example: entry.example || null });
      });
    });

    Object.keys(plainCats).forEach((key) => {
      const cat = plainCats[key];
      (levelData[key] || []).forEach((entry) => {
        items.push({ id: id++, de: entry.de, en: entry.en, cat, lvl, example: entry.example || null });
      });
    });
  });

  return items;
}

const CATS = ["der", "die", "das", "adj", "verb", "func", "phrase"];
const LEVELS = ["A1", "A2", "B1"];

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

}

// direction: 'de-en' shows German, asks for English. 'en-de' shows English, asks for German.
function promptText(card, direction) {
  return direction === "en-de" ? card.en : card.de;
}
function answerText(card, direction) {
  return direction === "en-de" ? card.de : card.en;
}

// Deterministic, grammatically-safe example sentence for a card.
// For nouns: a "gender character" mnemonic — der=strong, die=pretty, das=little —
// with a consistent color + icon so the article sticks through vivid association.
// Attributive adjective after der/die/das in nominative singular always takes -e (weak
// declension), so these are grammatically correct for every noun.
const GENDER_STYLE = {
  der: { color: "#3A5A8C", icon: "💪", adjs: ["stark", "cool", "groß", "mutig", "wild"] },
  die: { color: "#A5354A", icon: "🌸", adjs: ["schön", "elegant", "toll", "hübsch", "edel"] },
  das: { color: "#3F7A55", icon: "🐣", adjs: ["klein", "süß", "niedlich", "jung", "lieb"] },
};
const DIE_PLURAL_ADJS = ["lieb", "toll", "nett", "wild"];
function hashPick(seed, arr) {
  let h = 0;
  for (let i = 0; i < seed.length; i++) h = (h * 31 + seed.charCodeAt(i)) >>> 0;
  return arr[h % arr.length];
}
function exampleSentence(card) {
  // Prefer a hand-written sentence supplied as the third array element.
  if (card.example && String(card.example).trim()) return String(card.example).trim();
  const cat = card.cat;
  if (cat === "der" || cat === "die" || cat === "das") {
    let de = card.de;
    const isPl = /\(Pl\.\)/.test(de);
    de = de.replace(/\s*\((Pl\.|WG)\)/g, "").trim();
    const m = de.match(/^(der|die|das)\s+(.+)$/);
    let art = cat, noun = de;
    if (m) {
      art = m[1];
      noun = m[2].split(" / ")[0].trim();
    }
    const Art = art.charAt(0).toUpperCase() + art.slice(1);
    const style = GENDER_STYLE[art];
    // article + noun stay together at the front; predicate adjective (uninflected) is always correct
    if (isPl) {
      const adj = hashPick(de, DIE_PLURAL_ADJS);
      return `${style.icon} Die ${noun} sind ${adj}!`;
    }
    const adj = hashPick(de, style.adjs);
    return `${style.icon} ${Art} ${noun} ist ${adj}!`;
  }
  if (cat === "adj") {
    const a = card.de.split(" / ")[0].trim();
    return `Es ist ${a}.`;
  }
  if (cat === "verb") {
    let v = card.de.split(" / ")[0].trim();
    const reflexive = /\bsich\b|\(sich\)/.test(v);
    v = v.replace(/\s*\(sich\)/g, "").replace(/\bsich\b/g, "").trim();
    v = v.replace(/\s*\([^)]*\)/g, "").trim();
    v = v.replace(/\s+(auf|mit|an|um|für|über|von|zu|nach|aus|in|bei|vor)$/, "").trim();
    v = v.replace(/\s{2,}/g, " ").trim();
    if (reflexive) return `Ich möchte mich ${v}.`;
    return `Ich möchte ${v}.`;
  }
  return null; // function words & phrases are already usage examples — no frame needed
}

function ExampleLine({ card }) {
  const sentence = exampleSentence(card);
  if (!sentence) return null;
  const isNoun = card.cat === "der" || card.cat === "die" || card.cat === "das";
  if (isNoun) {
    const color = (GENDER_STYLE[card.cat] || {}).color || "#2b2620";
    return (
      <div
        style={{
          fontFamily: "Georgia, serif",
          fontWeight: 700,
          fontSize: "22px",
          color: color,

      >
        {sentence}
      </div>
    );
  }
  return (
    <div
      style={{
        fontFamily: "Georgia, serif",
        fontStyle: "italic",
        fontSize: "16px",
        color: "#3F7A55",
        textAlign: "center",
        padding: "4px 0",
      }}
    >
      {sentence}
    </div>
  );
}

function LevelToggle({ level, onChange }) {
  return (
    <div style={{ display: "flex", justifyContent: "center", gap: "0" }}>
      {LEVELS.map((lv, i) => (
        <button
          key={lv}
          onClick={() => onChange(lv)}
          style={{
            fontFamily: "'Courier New', monospace",
            fontSize: "12px",

            padding: "7px 18px",
            border: "1px solid #2b2620",
            borderRight: i < LEVELS.length - 1 ? "none" : "1px solid #2b2620",
            borderRadius: i === 0 ? "3px 0 0 3px" : i === LEVELS.length - 1 ? "0 3px 3px 0" : "0",
            background: level === lv ? "#2b2620" : "transparent",
            color: level === lv ? "#F6F1E5" : "#2b2620",
            cursor: "pointer",
          }}
        >
          {lv}
        </button>
      ))}
    </div>
  );
}

function Flashcards({ pool, allData, direction, noRepeat }) {
  const [order, setOrder] = useState(() => shuffle(pool.map((d) => d.id)));
  const [idx, setIdx] = useState(0);
  const [flipped, setFlipped] = useState(false);
  const [done, setDone] = useState(false);
  const byId = useMemo(() => Object.fromEntries(allData.map((d) => [d.id, d])), [allData]);

  React.useEffect(() => {
    setOrder(shuffle(pool.map((d) => d.id)));
    setIdx(0);
    setFlipped(false);
    setDone(false);
  }, [pool.length, noRepeat]);

  React.useEffect(() => {
    setFlipped(false);
  }, [direction]);

  if (pool.length === 0) {
    return <p style={{ textAlign: "center", color: "#8a8372" }}>No cards match this filter — pick at least one category above.</p>;
  }

  const restart = () => {
    setOrder(shuffle(pool.map((d) => d.id)));
    setIdx(0);
    setFlipped(false);
    setDone(false);
  };

  if (done) {
    return (
      <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: "16px", padding: "40px 0" }}>
        <div style={{ fontFamily: "Georgia, serif", fontSize: "22px", color: "#2b2620", textAlign: "center" }}>
          All {order.length} / {order.length} cards done 🎉
        </div>
        <button onClick={restart} style={navBtnStyle}>⟲ start over</button>
      </div>
    );
  }

  const card = byId[order[idx]];
  const front = promptText(card, direction);
  const back = answerText(card, direction);

  const next = () => {
    setFlipped(false);
    if (idx + 1 >= order.length) {
      if (noRepeat) {
        setDone(true);
      } else {
        setIdx(0);
      }
    } else {
      setIdx((i) => i + 1);
    }
  };
  const prev = () => {
    setFlipped(false);
    setIdx((i) => (i - 1 + order.length) % order.length);
  };
  const reshuffle = () => {
    setOrder(shuffle(pool.map((d) => d.id)));
    setIdx(0);
    setFlipped(false);
  };

  return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: "18px" }}>
      <div
        style={{
          fontFamily: "'Courier New', monospace",
          fontSize: "12px",
          letterSpacing: "0.1em",
          color: "#8a8372",
        }}
      >
        {noRepeat ? `${idx + 1} / ${order.length} attempted` : `CARD ${idx + 1} / ${order.length}`}
      </div>

      <div
        onClick={() => setFlipped((f) => !f)}
        style={{
          width: "min(420px, 90vw)",
          height: "260px",
          cursor: "pointer",
          perspective: "1200px",
        }}
      >
        <div
          style={{
            position: "relative",
            width: "100%",
            height: "100%",
            transition: "transform 0.45s cubic-bezier(.4,.2,.2,1)",
            transformStyle: "preserve-3d",
            transform: flipped ? "rotateY(180deg)" : "rotateY(0deg)",
          }}
        >
          {/* front */}
          <div
            style={{
              position: "absolute",
              inset: 0,
              backfaceVisibility: "hidden",
              background: "#FBF7EC",
              border: "1px solid #d8cfb8",
              borderRadius: "6px",
              boxShadow: "0 2px 0 #d8cfb8, 0 8px 20px rgba(60,50,20,0.08)",
              display: "flex",
              flexDirection: "column",
              alignItems: "center",
              justifyContent: "center",
              gap: "14px",
              padding: "24px",
            }}
          >
            <CatChip cat={card.cat} />
            <div
              style={{
                fontFamily: "Georgia, serif",
                fontSize: front.length > 28 ? "18px" : front.length > 16 ? "24px" : "30px",
                lineHeight: 1.3,
                color: "#2b2620",
                textAlign: "center",
              }}
            >
              {front}
            </div>
            <div style={{ fontFamily: "'Courier New', monospace", fontSize: "11px", color: "#b0a888" }}>
              tap to reveal
            </div>
          </div>
          {/* back */}
          <div
            style={{
              position: "absolute",
              inset: 0,
              backfaceVisibility: "hidden",
              transform: "rotateY(180deg)",
              background: CATEGORY_META[card.cat].color,
              borderRadius: "6px",
              boxShadow: "0 8px 20px rgba(60,50,20,0.18)",
              display: "flex",
              alignItems: "center",
              justifyContent: "center",
              padding: "24px",
            }}
          >
            <div
              style={{
                fontFamily: "Georgia, serif",
                fontSize: back.length > 28 ? "17px" : "22px",
                lineHeight: 1.35,
                color: "#F6F1E5",
                textAlign: "center",
              }}
            >
              {back}
            </div>
          </div>
        </div>
      </div>

      <div style={{ display: "flex", gap: "10px" }}>
        <button onClick={prev} style={navBtnStyle}>‹ prev</button>
        <button onClick={reshuffle} style={navBtnStyle}>⟲ shuffle</button>
        <button onClick={next} style={navBtnStyle}>next ›</button>
      </div>
    </div>
  );
}

const navBtnStyle = {
  fontFamily: "'Courier New', monospace",
  fontSize: "12px",
  letterSpacing: "0.06em",
  textTransform: "uppercase",
  padding: "8px 14px",
  borderRadius: "2px",
  border: "1px solid #2b2620",
  background: "#2b2620",
  color: "#F6F1E5",
  cursor: "pointer",
};

function makeQuestion(pool, correctPool) {
  const source = correctPool && correctPool.length > 0 ? correctPool : pool;
  const correct = source[Math.floor(Math.random() * source.length)];
  const sameCat = pool.filter((d) => d.cat === correct.cat && d.id !== correct.id);
  const distractPool = (sameCat.length >= 3 ? sameCat : pool.filter((d) => d.id !== correct.id));
  const distractors = shuffle(distractPool).slice(0, 3);
  const options = shuffle([correct, ...distractors]);
  return { correct, options };
}

function Quiz({ pool, allTime, onAnswer, sessions, onSaveSession, onClearHistory, direction, noRepeat }) {
  const [askedIds, setAskedIds] = useState(() => new Set());
  const [q, setQ] = useState(() => makeQuestion(pool));
  const [picked, setPicked] = useState(null);
  const [score, setScore] = useState({ right: 0, total: 0 });
  const [saved, setSaved] = useState(false);
  const [done, setDone] = useState(false);
  const [historyOpen, setHistoryOpen] = useState(false);

  const resetRound = React.useCallback(() => {
    const fresh = new Set();
    const nq = makeQuestion(pool);
    if (noRepeat) fresh.add(nq.correct.id);
    setAskedIds(fresh);
    setQ(nq);
    setPicked(null);
    setDone(false);
  }, [pool, noRepeat]);

  React.useEffect(() => {
    resetRound();
    setScore({ right: 0, total: 0 });
    setSaved(false);
  }, [pool.length, noRepeat, direction]);

  if (pool.length < 4) {
    return <p style={{ textAlign: "center", color: "#8a8372" }}>Pick at least a couple categories above — need a few options to quiz from.</p>;
  }

  const choose = (opt) => {
    if (picked) return;
    setPicked(opt);
    const correct = opt.id === q.correct.id;
    setScore((s) => ({ right: s.right + (correct ? 1 : 0), total: s.total + 1 }));
    setSaved(false);
    onAnswer && onAnswer(correct);
  };

  const nextQ = () => {
    if (noRepeat) {
      const remaining = pool.filter((d) => !askedIds.has(d.id));
      if (remaining.length === 0) {
        setDone(true);
        setPicked(null);
        return;
      }
      const nq = makeQuestion(pool, remaining);
      setAskedIds((prev) => new Set(prev).add(nq.correct.id));
      setQ(nq);
      setPicked(null);
    } else {
      setQ(makeQuestion(pool));
      setPicked(null);
    }
  };

  const finishSession = () => {
    if (score.total === 0) return;
    onSaveSession && onSaveSession(score);
    setSaved(true);
    setScore({ right: 0, total: 0 });
  };

  if (done) {
    return (
      <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: "16px", padding: "40px 0" }}>
        <div style={{ fontFamily: "'Courier New', monospace", fontSize: "12px", letterSpacing: "0.1em", color: "#8a8372" }}>
          SCORE {score.right} / {score.total}
        </div>
        <div style={{ fontFamily: "Georgia, serif", fontSize: "22px", color: "#2b2620", textAlign: "center" }}>
          All {pool.length} / {pool.length} words done 🎉
        </div>
        <div style={{ display: "flex", gap: "10px" }}>
          {score.total > 0 && (
            <button
              onClick={finishSession}
              style={{
                ...navBtnStyle,
                background: saved ? "#3F7A55" : "transparent",
                border: `1px solid ${saved ? "#3F7A55" : "#8a8372"}`,
                color: saved ? "#F6F1E5" : "#8a8372",
              }}
            >
              {saved ? "✓ saved" : "finish & save this round"}
            </button>
          )}
          <button onClick={resetRound} style={navBtnStyle}>⟲ start over</button>
        </div>
      </div>
    );
  }

  return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: "18px" }}>
      <div
        style={{
          fontFamily: "'Courier New', monospace",
          fontSize: "12px",
          letterSpacing: "0.1em",
          color: "#8a8372",
        }}
      >
        SCORE {score.right} / {score.total}
        {allTime && allTime.total > 0 && (
          <span style={{ marginLeft: "14px", color: "#b0a888" }}>
            · ALL-TIME {allTime.right} / {allTime.total}
          </span>
        )}
      </div>

      {noRepeat && (
        <div
          style={{
            fontFamily: "'Courier New', monospace",
            fontSize: "11px",
            letterSpacing: "0.08em",
            color: "#8a8372",
            marginTop: "-10px",
          }}
        >
          {askedIds.size} / {pool.length} attempted
        </div>
      )}

      <div style={{ textAlign: "center" }}>
        <div style={{ marginBottom: "8px" }}><CatChip cat={q.correct.cat} /></div>
        <div style={{ fontFamily: "Georgia, serif", fontSize: "26px", color: "#2b2620" }}>{promptText(q.correct, direction)}</div>
      </div>

      <div style={{ display: "flex", flexDirection: "column", gap: "10px", width: "min(420px, 90vw)" }}>
        {q.options.map((opt) => {
          let bg = "#FBF7EC";
          let border = "#d8cfb8";
          let color = "#2b2620";
          if (picked) {
            if (opt.id === q.correct.id) {
              bg = "#3F7A55"; border = "#3F7A55"; color = "#F6F1E5";
            } else if (opt.id === picked.id) {
              bg = "#A5354A"; border = "#A5354A"; color = "#F6F1E5";
            }
          }
          const optText = answerText(opt, direction);
          return (
            <button
              key={opt.id}
              onClick={() => choose(opt)}
              style={{
                textAlign: "left",
                fontFamily: "Georgia, serif",
                fontSize: optText.length > 28 ? "13px" : "16px",
                padding: "12px 16px",
                borderRadius: "4px",
                border: `1px solid ${border}`,
                background: bg,
                color,
                cursor: picked ? "default" : "pointer",
              }}
            >
              {optText}
            </button>
          );
        })}
      </div>

      {picked && <ExampleLine card={q.correct} />}

      {picked && (
        <button onClick={nextQ} style={navBtnStyle}>next question ›</button>
      )}

      {score.total > 0 && (
        <button
          onClick={finishSession}
          style={{
            ...navBtnStyle,
            background: saved ? "#3F7A55" : "transparent",
            border: `1px solid ${saved ? "#3F7A55" : "#8a8372"}`,
            color: saved ? "#F6F1E5" : "#8a8372",
          }}
        >
          {saved ? "✓ saved" : "finish & save this round"}
        </button>
      )}

      {sessions && sessions.length > 0 && (
        <div style={{ width: "min(420px, 90vw)", marginTop: "10px" }}>
          <div
            style={{
              display: "flex",
              alignItems: "center",
              justifyContent: "center",
              gap: "12px",
            }}
          >
            <button
              onClick={() => setHistoryOpen((o) => !o)}
              style={{
                fontFamily: "'Courier New', monospace",
                fontSize: "11px",
                letterSpacing: "0.1em",
                color: "#8a8372",
                background: "transparent",
                border: "none",
                padding: 0,
                cursor: "pointer",
              }}
            >
              {historyOpen ? "▾" : "▸"} PAST ROUNDS ({sessions.length})
            </button>
            {historyOpen && onClearHistory && (
              <button
                onClick={() => {
                  if (window.confirm("Clear all saved rounds? This can't be undone.")) onClearHistory();
                }}
                style={{
                  fontFamily: "'Courier New', monospace",
                  fontSize: "10px",
                  letterSpacing: "0.08em",
                  textTransform: "uppercase",
                  color: "#A5354A",
                  background: "transparent",
                  border: "1px solid #A5354A",
                  borderRadius: "10px",
                  padding: "2px 8px",
                  cursor: "pointer",
                }}
              >
                clear history
              </button>
            )}
          </div>
          {historyOpen && (
            <div style={{ display: "flex", flexDirection: "column", gap: "6px", marginTop: "10px" }}>
              {sessions.map((s) => {
                const pct = s.total ? Math.round((s.right / s.total) * 100) : 0;
                const d = s.timestamp ? new Date(s.timestamp) : null;
                const dateStr = d
                  ? d.toLocaleDateString(undefined, { month: "short", day: "numeric" }) +
                    " " +
                    d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" })
                  : "";
                return (
                  <div
                    key={s.id}
                    style={{
                      display: "flex",
                      justifyContent: "space-between",
                      fontFamily: "'Courier New', monospace",
                      fontSize: "12px",
                      color: "#5a5344",
                      background: "#FBF7EC",
                      border: "1px solid #e4dcc4",
                      borderRadius: "3px",
                      padding: "7px 12px",
                    }}
                  >
                    <span>{dateStr}</span>
                    <span>{s.right}/{s.total} ({pct}%)</span>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

const ARTICLE_OPTIONS = ["der", "die", "das"];
function stripArticle(deText) {
  return deText.replace(/^(der|die|das)\s+/, "");
}
function makeArticleQuestion(nounPool, correctPool) {
  const source = correctPool && correctPool.length > 0 ? correctPool : nounPool;
  const word = source[Math.floor(Math.random() * source.length)];
  return word;
}

function ArticleQuiz({ pool, noRepeat }) {
  const nounPool = useMemo(() => pool.filter((d) => d.cat === "der" || d.cat === "die" || d.cat === "das"), [pool]);

  const [askedIds, setAskedIds] = useState(() => new Set());
  const [word, setWord] = useState(() => (nounPool.length > 0 ? makeArticleQuestion(nounPool) : null));
  const [picked, setPicked] = useState(null);
  const [score, setScore] = useState({ right: 0, total: 0 });
  const [saved, setSaved] = useState(false);
  const [done, setDone] = useState(false);

  const resetRound = React.useCallback(() => {
    if (nounPool.length === 0) return;
    const w = makeArticleQuestion(nounPool);
    const fresh = new Set();
    if (noRepeat) fresh.add(w.id);
    setAskedIds(fresh);
    setWord(w);
    setPicked(null);
    setDone(false);
  }, [nounPool, noRepeat]);

  React.useEffect(() => {
    resetRound();
    setScore({ right: 0, total: 0 });
    setSaved(false);
  }, [nounPool.length, noRepeat]);

  if (nounPool.length === 0) {
    return <p style={{ textAlign: "center", color: "#8a8372" }}>Select at least one of der / die / das above to practice articles.</p>;
  }
  if (!word) return null;

  const choose = (article) => {
    if (picked) return;
    setPicked(article);
    const correct = article === word.cat;
    setScore((s) => ({ right: s.right + (correct ? 1 : 0), total: s.total + 1 }));
    setSaved(false);
  };

  const nextQ = () => {
    if (noRepeat) {
      const remaining = nounPool.filter((d) => !askedIds.has(d.id));
      if (remaining.length === 0) {
        setDone(true);
        setPicked(null);
        return;
      }
      const w = makeArticleQuestion(nounPool, remaining);
      setAskedIds((prev) => new Set(prev).add(w.id));
      setWord(w);
      setPicked(null);
    } else {
      setWord(makeArticleQuestion(nounPool));
      setPicked(null);
    }
  };

  if (done) {
    return (
      <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: "16px", padding: "40px 0" }}>
        <div style={{ fontFamily: "'Courier New', monospace", fontSize: "12px", letterSpacing: "0.1em", color: "#8a8372" }}>
          SCORE {score.right} / {score.total}
        </div>
        <div style={{ fontFamily: "Georgia, serif", fontSize: "22px", color: "#2b2620", textAlign: "center" }}>
          All {nounPool.length} / {nounPool.length} nouns done 🎉
        </div>
        <button onClick={resetRound} style={navBtnStyle}>⟲ start over</button>
      </div>
    );
  }

  const bare = stripArticle(word.de);

  return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: "18px" }}>
      <div
        style={{
          fontFamily: "'Courier New', monospace",
          fontSize: "12px",
          letterSpacing: "0.1em",
          color: "#8a8372",
        }}
      >
        SCORE {score.right} / {score.total}
      </div>

      {noRepeat && (
        <div
          style={{
            fontFamily: "'Courier New', monospace",
            fontSize: "11px",
            letterSpacing: "0.08em",
            color: "#8a8372",
            marginTop: "-10px",
          }}
        >
          {askedIds.size} / {nounPool.length} attempted
        </div>
      )}

      <div style={{ textAlign: "center" }}>
        <div style={{ fontFamily: "Georgia, serif", fontSize: "30px", color: "#2b2620" }}>{bare}</div>
        <div style={{ fontFamily: "Georgia, serif", fontSize: "14px", color: "#8a8372", marginTop: "6px" }}>{word.en}</div>
      </div>

      <div style={{ display: "flex", gap: "10px" }}>
        {ARTICLE_OPTIONS.map((art) => {
          const meta = CATEGORY_META[art];
          let bg = "transparent";
          let color = meta.color;
          if (picked) {
            if (art === word.cat) { bg = meta.color; color = "#F6F1E5"; }
            else if (art === picked && picked !== word.cat) { bg = "#A5354A"; color = "#F6F1E5"; }
          }
          return (
            <button
              key={art}
              onClick={() => choose(art)}
              style={{
                fontFamily: "Georgia, serif",
                fontSize: "20px",
                padding: "14px 28px",
                borderRadius: "4px",
                border: `2px solid ${picked && art === word.cat ? meta.color : picked && art === picked ? "#A5354A" : meta.color}`,
                background: bg,
                color,
                cursor: picked ? "default" : "pointer",
              }}
            >
              {art}
            </button>
          );
        })}
      </div>

      {picked && <ExampleLine card={word} />}

      {picked && (
        <button onClick={nextQ} style={navBtnStyle}>next question ›</button>
      )}
    </div>
  );
}

// A single fixed record shared by every browser/device — since this trainer
// is for one person only, there's no need for a separate identity per browser.
const PROGRESS_DOC_ID = "harsimar-progress";
function App() {
  const [mode, setMode] = useState("flash");
  const [activeCats, setActiveCats] = useState(CATS);
  const [level, setLevel] = useState("A2");
  const [direction, setDirection] = useState("de-en");
  const [noRepeat, setNoRepeat] = useState(false);
  const [settingsOpen, setSettingsOpen] = useState(false);
  const [ready, setReady] = useState(false);
  const [allTime, setAllTime] = useState({ right: 0, total: 0 });
  const [sessions, setSessions] = useState([]);

  // Vocabulary is fetched at startup from VOCAB_DATA_URL rather than bundled here.
  const [allData, setAllData] = useState(null); // null while loading
  const [dataError, setDataError] = useState(null);
  const [loadAttempt, setLoadAttempt] = useState(0);

  const toggleCat = useCallback((c) => {
    setActiveCats((prev) => (prev.includes(c) ? prev.filter((x) => x !== c) : [...prev, c]));
  }, []);

  React.useEffect(() => {
    let cancelled = false;
    setAllData(null);
    setDataError(null);
    fetch(VOCAB_DATA_URL)
      .then((res) => {
        if (!res.ok) throw new Error(`HTTP ${res.status} fetching vocab data`);
        return res.json();
      })
      .then((json) => {
        if (cancelled) return;
        const items = buildDataFromJson(json);
        if (!items.length) throw new Error("Vocab data loaded but contained no entries");
        setAllData(items);
      })
      .catch((err) => {
        if (cancelled) return;
        console.error("Failed to load vocab data:", err);
        setDataError((err && err.message) || String(err));
      });
    return () => {
      cancelled = true;
    };
  }, [loadAttempt]);

  const levelData = useMemo(() => (allData ? allData.filter((d) => d.lvl === level) : []), [allData, level]);
  const pool = useMemo(() => levelData.filter((d) => activeCats.includes(d.cat)), [levelData, activeCats]);

  const loadSessions = useCallback(() => {
    const fb = getFirebase();
    if (!fb) return;
    fb.db
      .collection("scores").doc(PROGRESS_DOC_ID).collection("sessions")
      .orderBy("timestamp", "desc")
      .limit(15)
      .get()
      .then((qs) => {
        setSessions(qs.docs.map((d) => ({ id: d.id, ...d.data() })));
      })
      .catch((err) => console.error("loadSessions failed:", err.code || err.message || err));
  }, []);

  // Sign in anonymously (required by the security rules) then load the one shared record
  React.useEffect(() => {
    const fb = getFirebase();
    if (!fb) return; // Firebase SDK not loaded — app still works, just no persistence
    const unsub = fb.auth.onAuthStateChanged((user) => {
      if (user) {
        setReady(true);
        fb.db.collection("scores").doc(PROGRESS_DOC_ID).get().then((snap) => {
          if (snap.exists) {
            const d = snap.data();
            setAllTime({ right: d.right || 0, total: d.total || 0 });
          }
        }).catch((err) => console.error("load allTime failed:", err.code || err.message || err));
        loadSessions();
      }
    });
    fb.auth.signInAnonymously().catch(() => {});
    return () => unsub && unsub();
  }, [loadSessions]);

  const handleAnswer = useCallback((correct) => {
    setAllTime((prev) => {
      const next = { right: prev.right + (correct ? 1 : 0), total: prev.total + 1 };
      const fb = getFirebase();
      if (fb && ready) {
        fb.db.collection("scores").doc(PROGRESS_DOC_ID).set(
          {
            right: window.firebase.firestore.FieldValue.increment(correct ? 1 : 0),
            total: window.firebase.firestore.FieldValue.increment(1),
          },
          { merge: true }
        ).catch((err) => console.error("save allTime failed:", err.code || err.message || err));
      }
      return next;
    });
  }, [ready]);

  const handleSaveSession = useCallback((score) => {
    const fb = getFirebase();
    if (!fb || !ready) return;
    const record = { right: score.right, total: score.total, cats: activeCats, timestamp: Date.now() };
    fb.db
      .collection("scores").doc(PROGRESS_DOC_ID).collection("sessions")
      .add(record)
      .then(() => loadSessions())
      .catch((err) => console.error("save session failed:", err.code || err.message || err));
  }, [ready, activeCats, loadSessions]);

  const handleClearHistory = useCallback(() => {
    const fb = getFirebase();
    if (!fb || !ready) return;
    const sessionsRef = fb.db.collection("scores").doc(PROGRESS_DOC_ID).collection("sessions");
    sessionsRef
      .get()
      .then((qs) => {
        const batch = fb.db.batch();
        qs.docs.forEach((d) => batch.delete(d.ref));
        return batch.commit();
      })
      .then(() => setSessions([]))
      .catch((err) => console.error("clear history failed:", err.code || err.message || err));
  }, [ready]);

  const shellStyle = {
    minHeight: "100%",
    background: "#F6F1E5",
    padding: "36px 20px 48px",
    fontFamily: "Georgia, serif",
    display: "flex",
    alignItems: "center",
    justifyContent: "center",
  };

  if (dataError) {
    return (
      <div style={shellStyle}>
        <div style={{ maxWidth: "420px", textAlign: "center", display: "flex", flexDirection: "column", gap: "16px" }}>
          <div style={{ fontSize: "22px", color: "#2b2620" }}>Couldn't load the vocabulary</div>
          <div style={{ fontFamily: "'Courier New', monospace", fontSize: "12px", color: "#A5354A" }}>{dataError}</div>
          <div style={{ fontSize: "13px", color: "#8a8372" }}>
            Checked <code>{VOCAB_DATA_URL}</code>
          </div>
          <button onClick={() => setLoadAttempt((n) => n + 1)} style={navBtnStyle}>⟲ retry</button>
        </div>
      </div>
    );
  }

  if (!allData) {
    return (
      <div style={shellStyle}>
        <div style={{ fontFamily: "'Courier New', monospace", fontSize: "13px", letterSpacing: "0.1em", color: "#8a8372" }}>
          loading vocabulary …
        </div>
      </div>
    );
  }

  return (
    <div
      style={{
        minHeight: "100%",
        background: "#F6F1E5",
        padding: "36px 20px 48px",
        fontFamily: "Georgia, serif",
      }}
    >
      <div style={{ maxWidth: "560px", margin: "0 auto", display: "flex", flexDirection: "column", gap: "16px" }}>
        <div style={{ textAlign: "center" }}>
          <div
            style={{
              display: "inline-block",
              fontFamily: "'Courier New', monospace",
              fontSize: "10px",
              letterSpacing: "0.08em",
              textTransform: "uppercase",
              color: "#8a8372",
              border: "1px solid #d8cfb8",
              borderRadius: "10px",
              padding: "3px 10px",
              marginBottom: "8px",
            }}
          >
            ⇣ data fetched from JSON file
          </div>
          <div style={{ fontFamily: "'Courier New', monospace", fontSize: "11px", letterSpacing: "0.18em", color: "#8a8372", marginBottom: "4px" }}>
            {level === "A1" ? "A1 · BREAKTHROUGH" : level === "B1" ? "B1 · THRESHOLD" : "A2 · WAYSTAGE"}
          </div>
          <div style={{ fontSize: "28px", color: "#2b2620" }}>Deutscher Wortschatz</div>
          <div style={{ fontSize: "13px", color: "#8a8372", marginTop: "2px" }}>
            {levelData.length} cards — nouns, verbs, adjectives, connectors &amp; phrases
          </div>
        </div>

        <div style={{ textAlign: "center" }}>
          <button
            onClick={() => setSettingsOpen((o) => !o)}
            style={{
              fontFamily: "'Courier New', monospace",
              fontSize: "11px",
              letterSpacing: "0.06em",
              color: "#8a8372",
              background: "transparent",
              border: "1px solid #d8cfb8",
              borderRadius: "12px",
              padding: "6px 14px",
              cursor: "pointer",
              maxWidth: "100%",
            }}
          >
            {settingsOpen ? "▾" : "▸"} {level} · {activeCats.length === CATS.length ? "all categories" : `${activeCats.length}/${CATS.length} categories`} · {direction === "de-en" ? "DE→EN" : "EN→DE"}
            {noRepeat ? " · no repeats" : ""}
          </button>
        </div>

        {settingsOpen && (
          <div style={{ display: "flex", flexDirection: "column", gap: "14px" }}>
            <LevelToggle level={level} onChange={setLevel} />
            <FilterBar active={activeCats} onToggle={toggleCat} />
            <div style={{ display: "flex", justifyContent: "center", gap: "10px", flexWrap: "wrap" }}>
              <DirectionToggle direction={direction} onChange={setDirection} />
              <NoRepeatToggle noRepeat={noRepeat} onChange={setNoRepeat} />
            </div>
          </div>
        )}

        <div style={{ display: "flex", justifyContent: "center", gap: "0" }}>
          {["flash", "quiz", "articles"].map((m, i) => (
            <button
              key={m}
              onClick={() => setMode(m)}
              style={{
                fontFamily: "'Courier New', monospace",
                fontSize: "12px",
                letterSpacing: "0.1em",
                textTransform: "uppercase",
                padding: "8px 20px",
                border: "1px solid #2b2620",
                borderRight: i < 2 ? "none" : "1px solid #2b2620",
                borderRadius: i === 0 ? "3px 0 0 3px" : i === 2 ? "0 3px 3px 0" : "0",
                background: mode === m ? "#2b2620" : "transparent",
                color: mode === m ? "#F6F1E5" : "#2b2620",
                cursor: "pointer",
              }}
            >
              {m === "flash" ? "Flashcards" : m === "quiz" ? "Quiz" : "Articles"}
            </button>
          ))}
        </div>

        <div style={{ marginTop: "6px" }}>
          {mode === "flash" && <Flashcards pool={pool} allData={allData} direction={direction} noRepeat={noRepeat} />}
          {mode === "quiz" && <Quiz pool={pool} allTime={allTime} onAnswer={handleAnswer} sessions={sessions} onSaveSession={handleSaveSession} onClearHistory={handleClearHistory} direction={direction} noRepeat={noRepeat} />}
          {mode === "articles" && <ArticleQuiz pool={pool} noRepeat={noRepeat} />}
        </div>
      </div>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
